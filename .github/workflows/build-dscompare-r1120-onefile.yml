          Set-Location $env:DS_COMPARE_SOURCE
          $dist=Join-Path $env:DS_COMPARE_SOURCE 'dist'
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name DSCompare --icon assets/DSCompare.ico --collect-all OCP --hidden-import dsac29.parallel_import --hidden-import dsac29.icons_r119 --hidden-import dsac29.z3_support --hidden-import dsac29.import_cache --hidden-import dsac29.gui_modern --hidden-import dsac29.zw3d_launcher --hidden-import dsac29.mass_batch --hidden-import dsac29.mass_drop --hidden-import dsac29.step_diagnostics --add-data "build_info.json;." --add-data "assets/DSCompare.ico;assets" --add-data "assets/DSCompare.png;assets" --distpath "$dist" DSCompareV3.py
          if($LASTEXITCODE -ne 0){throw 'PyInstaller --onefile failed'}
          $exe=Join-Path $dist 'DSCompare.exe'
          if(-not (Test-Path $exe)){throw 'Missing standalone DSCompare.exe'}
          $files=@(Get-ChildItem $dist -File)
          if($files.Count -ne 1 -or $files[0].Name -ne 'DSCompare.exe'){throw 'Dist must contain one executable only'}
          "DSCOMPARE_ONEFILE_EXE=$exe" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Portable standalone EXE: $((Get-Item $exe).Length) bytes"
      - name: Validate frozen GUI startup marker without hanging on bootloader cleanup
        shell: pwsh
        timeout-minutes: 4
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $ErrorActionPreference='Stop'
          $exe=$env:DSCOMPARE_ONEFILE_EXE
          if(-not (Test-Path $exe)){throw 'Single EXE missing'}
          $dest=Join-Path $env:RUNNER_TEMP 'DSCOMPARE_R1123_UI'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $status=Join-Path $dest 'UI_OK.json'
          $errors=Join-Path $dest 'UI_ERROR.txt'
          $p=Start-Process -FilePath $exe -ArgumentList @('--smoke-test-ui',$dest) -PassThru
          $deadline=(Get-Date).AddMinutes(2)
          while(-not (Test-Path $status) -and -not (Test-Path $errors) -and -not $p.HasExited -and (Get-Date) -lt $deadline){
            Start-Sleep -Seconds 2
            $p.Refresh()
          }
          if(Test-Path $errors){
            Get-Content $errors | Write-Host
            throw 'Frozen UI smoke reported exception'
          }
          if(-not (Test-Path $status)){
            if(-not $p.HasExited){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}
            throw 'Frozen UI did not produce UI_OK.json within 2 min'
          }
          Write-Host 'Frozen GUI startup, theme switching and three pages PASS'
          # PyInstaller onefile on Windows may show a modal _MEI cleanup warning
          # AFTER the actual UI test successfully exits. Do not leave CI blocked.
          Start-Sleep -Seconds 3
          $p.Refresh()
          if(-not $p.HasExited){
            Write-Host 'WARNING: bootloader is still running after successful UI marker (_MEI cleanup).'
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Package one executable in single ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=$env:DSCOMPARE_ONEFILE_EXE
          $out=Join-Path $env:GITHUB_WORKSPACE 'DSCompare_R1124_JEDEN_EXE_WINDOWS_x64.zip'
          Compress-Archive -LiteralPath $exe -DestinationPath $out -CompressionLevel Optimal
          if(-not (Test-Path $out)){throw 'ZIP missing'}
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z=[IO.Compression.ZipFile]::OpenRead($out)
          try {
            $entries=@($z.Entries | Where-Object { $_.Name })
            if($entries.Count -ne 1 -or $entries[0].FullName -ne 'DSCompare.exe'){throw 'ZIP must contain only DSCompare.exe'}
          }
          finally {$z.Dispose()}
          Write-Host "R11.24 ONE EXE ZIP: $((Get-Item $out).Length) bytes"
      - name: Upload ONE EXE Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: DSCompare-R1124-ONE-EXE-Windows-x64
          path: DSCompare_R1124_JEDEN_EXE_WINDOWS_x64.zip
          if-no-files-found: error
          retention-days: 30
