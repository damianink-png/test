name: DS Compare UI source anchors
on:
  push:
    branches: [codex/rc9-palette-20261102]
    paths: ['.github/workflows/dscompare-ui-anchors.yml', 'review/fix06/ci/patch_gui_minimal.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect frozen source UI anchors without changing the archive
        run: |
          python - <<'PY'
          import zipfile,re
          z=zipfile.ZipFile('DSCompare_RC9_KOMPLET_ZRODLA.zip')
          patterns=('Nowe porównanie','Porównaj rewizje','Więcej','Niepełna analiza geometrii','Zapisz raport częściowy','search_results','ResultsWorkspace')
          for name in z.namelist():
              if not (name.endswith(('.py','.svelte')) and any(p in name.lower() for p in ('gui','app.svelte','result','worker','main'))):
                  continue
              try:
                  lines=z.read(name).decode('utf-8').splitlines()
              except (UnicodeError,KeyError):
                  continue
              matches=[i for i,line in enumerate(lines) if any(p in line for p in patterns)]
              if not matches:continue
              print('UI_SOURCE',name,'MATCHES',len(matches))
              for i in matches[:15]:
                  print('MATCH',i+1)
                  for k in range(max(0,i-4),min(len(lines),i+5)):
                      print(f'{k+1}: {lines[k][:300]}')
          
          for name,start,end in (
              ('dscompare_rc9_manual/dsac29/gui46.py',230,260),
              ('dscompare_rc9_manual/dsac29/gui46.py',255,335),
              ('dscompare_rc9_manual/dsac29/gui_modern.py',580,675),
              ('dscompare_rc9_manual/dsac29/gui_modern.py',668,715),
              ('dscompare_rc9_manual/dsac29/gui45.py',305,350),
              ('dscompare_rc9_manual/dsac29/gui.py',485,565),
          ):
              lines=z.read(name).decode('utf-8').splitlines()
              print('SOURCE_RANGE',name,start,end)
              for i in range(start-1,min(end,len(lines))):
                  print(f'{i+1}: {lines[i][:260]}')
          PY
      - name: Apply GUI patch to actual frozen sources and check syntax
        run: |
          python -m zipfile -e DSCompare_RC9_KOMPLET_ZRODLA.zip .
          python review/fix06/ci/patch_gui_minimal.py dscompare_rc9_manual
          python -m py_compile dscompare_rc9_manual/dsac29/gui_modern.py dscompare_rc9_manual/dsac29/gui45.py
          python - <<'PY'
          from pathlib import Path
          p=Path('dscompare_rc9_manual/dsac29/gui_modern.py').read_text(encoding='utf-8')
          assert p.index('lay.addWidget(self._compare_run_host)')<p.index('lay.addWidget(self.reset_button')<p.index('self._compare_progress_panel=QFrame')
          assert 'self._details_toggle.setVisible(done)' not in p
          print('GUI_PATCH_SOURCE_ASSERTIONS_PASS')
          PY
