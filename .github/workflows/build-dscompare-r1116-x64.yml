      - name: R11.13 regression for repeated native definitions
        shell: pwsh
        run: |
          Set-Location $env:DS_COMPARE_SOURCE
          $env:PYTHONPATH=$env:DS_COMPARE_SOURCE
          @'
          from OCP.BRepPrimAPI import BRepPrimAPI_MakeBox
          from OCP.gp import gp_Trsf, gp_Vec
          from OCP.TopLoc import TopLoc_Location
          from dsac29.geometry import describe
          from dsac29.geometry_registry import GeometryRegistry
          from dsac29.compare import compare
          from unittest.mock import patch
          original_a=BRepPrimAPI_MakeBox(20.,10.,5.).Shape()
          original_b=BRepPrimAPI_MakeBox(20.,10.,5.).Shape()
          def make(original,dx):
              parts=[]
              for i in range(24):
                  tr=gp_Trsf();tr.SetTranslation(gp_Vec(float(i*50+dx),0.,0.))
                  parts.append(describe(original.Located(TopLoc_Location(tr)),'ELEMENT','ELEMENT'))
              return parts
          a,b=make(original_a,0),make(original_b,3000)
          called=[]
          def false_brep(*a,**kw):
              called.append(1)
              return False,None,None
          with patch('dsac29.compare.equivalent_rigid',false_brep):
              records=compare(a,b,revision_only=True,geometry_context=GeometryRegistry())
          assert len(called)==1, f'Repeated native B-Rep {len(called)} times'
          assert sum(r.status=='ADDED' for r in records)==24
          assert sum(r.status=='REMOVED' for r in records)==24
          print('R11.13 native definitions: 576 possible cross-pairs, 1 expensive B-Rep call')
          '@ | Set-Content -Path (Join-Path $env:GITHUB_WORKSPACE 'R1113_registry_test.py') -Encoding UTF8
          python (Join-Path $env:GITHUB_WORKSPACE 'R1113_registry_test.py')
          if($LASTEXITCODE -ne 0){throw 'R1113 native regression failure'}
      - name: Compile DSCompare.exe for Windows x64
        shell: pwsh
        run: |
          Set-Location $env:DS_COMPARE_SOURCE
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name DSCompare --icon assets/DSCompare.ico --collect-all OCP --hidden-import dsac29.parallel_import --hidden-import dsac29.icons_r119 --hidden-import dsac29.z3_support --hidden-import dsac29.import_cache --hidden-import dsac29.gui_modern --add-data "build_info.json;." --add-data "assets/DSCompare.ico;assets" --add-data "assets/DSCompare.png;assets" DSCompareV3.py
          if($LASTEXITCODE -ne 0){throw 'PyInstaller Windows build failed'}
          if(-not (Test-Path (Join-Path $env:DS_COMPARE_OUT 'DSCompare.exe'))){throw 'Missing DSCompare.exe'}
      - name: Compile ZW3D bridge DLL
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $where=Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs=& $where -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if(-not $vs){throw 'Missing MSVC'}
          $env:DS_COMPARE_VCVARS=Join-Path $vs 'VC/Auxiliary/Build/vcvars64.bat'
          & cmd.exe /d /c (Join-Path $env:DS_COMPARE_SOURCE 'bridge/build_bridge_wrapper.cmd')
          if($LASTEXITCODE -ne 0){throw 'ZW3D bridge DLL build failed'}
          if(-not (Test-Path (Join-Path $env:DS_COMPARE_OUT 'DSAssemblyCompare2019.dll'))){throw 'Missing ZW3D bridge DLL'}
      - name: Smoke-test compiled EXE, BOM and STEP
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $out=$env:DS_COMPARE_OUT
          $src=$env:DS_COMPARE_SOURCE
          $exe=Join-Path $out 'DSCompare.exe'
          $env:DSCOMPARE_PARALLEL_IMPORT='on'
          $result=Join-Path $env:RUNNER_TEMP 'R119_SMOKE_RESULTS'
          $p=Start-Process -FilePath $exe -ArgumentList @('--worker','compare','--a',(Join-Path $src 'samples/RAMA_REV_03.step'),'--b',(Join-Path $src 'samples/RAMA_REV_04.step'),'--output',$result,'--generate-step','--revision-style','--safe-export','--body-colors','--step-verify','full') -Wait -PassThru
          $fullCode=$p.ExitCode
          Write-Host "R119 FULL MODE EXIT=$fullCode"
          if(Test-Path $result){Get-ChildItem $result | Select-Object Name,Length | Out-String | Write-Host}
          $errfile=Join-Path $result '_WYNIK_V37.json'
          if(Test-Path $errfile){Get-Content $errfile -Encoding UTF8 -Raw | Write-Host}
          $events=Join-Path $result '_POSTEP_V37.jsonl'
          if(Test-Path $events){Get-Content $events -Encoding UTF8 -Tail 20 | Write-Host}
          $fastResult=Join-Path $env:RUNNER_TEMP 'R119_FAST_MODE'
          $p=Start-Process -FilePath $exe -ArgumentList @('--worker','compare','--a',(Join-Path $src 'samples/RAMA_REV_03.step'),'--b',(Join-Path $src 'samples/RAMA_REV_04.step'),'--output',$fastResult,'--generate-step','--revision-style','--safe-export','--body-colors','--step-verify','fast') -Wait -PassThru
          $fastCode=$p.ExitCode
          Write-Host "R119 FAST MODE EXIT=$fastCode"
          if(Test-Path $fastResult){Get-ChildItem $fastResult | Select-Object Name,Length | Out-String | Write-Host}
          $errfile=Join-Path $fastResult '_WYNIK_V37.json'
          if(Test-Path $errfile){Get-Content $errfile -Encoding UTF8 -Raw | Write-Host}
          if($fullCode -ne 0 -or $fastCode -ne 0){throw "Frozen EXE full=$fullCode fast=$fastCode failed"}
          foreach($name in @('POROWNANIE_KOLORY.step','BOM_A.csv','BOM_B.csv','RAPORT.html','ZMIANY.csv','PODSUMOWANIE.json')){
            if(-not (Test-Path (Join-Path $result $name))){throw "Missing R119 result $name"}
          }
          if(Test-Path (Join-Path $result 'RAPORT_ZMIAN.html')){throw 'Obsolete second report generated'}
          $summary=Get-Content (Join-Path $result 'PODSUMOWANIE.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          if($summary.solids_A -ne 13 -or $summary.solids_B -ne 13){throw 'Unexpected solids count in R119 EXE'}
          Remove-Item Env:DSCOMPARE_PARALLEL_IMPORT
          $p=Start-Process -FilePath $exe -ArgumentList @('--smoke-test-ui',(Join-Path $env:RUNNER_TEMP 'R119_UI_SMOKE')) -Wait -PassThru
          if($p.ExitCode -ne 0){throw "R119 GUI smoke failed exit=$($p.ExitCode)"}
      - name: Verify fast BOM and HTML-only report
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=Join-Path $env:DS_COMPARE_OUT 'DSCompare.exe'
          $src=$env:DS_COMPARE_SOURCE
          $result=Join-Path $env:RUNNER_TEMP 'R1110_FAST_BOM_RESULTS'
          $p=Start-Process -FilePath $exe -ArgumentList @('--worker','compare','--a',(Join-Path $src 'samples/MODEL_A.step'),'--b',(Join-Path $src 'samples/MODEL_B.step'),'--output',$result,'--fast-bom','--no-bom-csv','--revision-style') -Wait -PassThru
          if($p.ExitCode -ne 0){throw "R1110 fast BOM EXE exited $($p.ExitCode)"}
          if(-not (Test-Path (Join-Path $result 'RAPORT.html'))){throw 'R1110 missing HTML report'}
          if(Test-Path (Join-Path $result 'BOM_A.csv')){throw 'R1110 unexpectedly created BOM A CSV'}
          if(Test-Path (Join-Path $result 'BOM_B.csv')){throw 'R1110 unexpectedly created BOM B CSV'}
          $html=Get-Content (Join-Path $result 'RAPORT.html') -Raw -Encoding UTF8
          if($html -notmatch '<details class="panel bom-panel">'){throw 'R1110 missing collapsible BOM'}
          $data=Get-Content (Join-Path $result 'PODSUMOWANIE.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          if($data.bom_mode -ne 'szybki' -or $data.bom_csv){throw 'R1110 fast BOM flags ignored'}
          Write-Host 'R11.10 HTML-only fast BOM smoke PASS'
      - name: Check default Windows worker has no ABSR containers
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'R1112_NO_ABSR'
          $exe=Join-Path $env:DS_COMPARE_OUT 'DSCompare.exe'
          $src=$env:DS_COMPARE_SOURCE
          $p=Start-Process -FilePath $exe -ArgumentList @('--worker','compare','--a',(Join-Path $src 'samples/RAMA_REV_03.step'),'--b',(Join-Path $src 'samples/RAMA_REV_04.step'),'--output',$root,'--generate-step','--revision-style','--no-bom','--step-verify','fast') -Wait -PassThru
          if($p.ExitCode -ne 0){throw "R1112 EXE comparison failed: $($p.ExitCode)"}
          @'
          import re,os,json
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'R1112_NO_ABSR'
          raw=(p/'POROWNANIE_KOLORY.step').read_bytes()
          d=json.loads((p/'PODSUMOWANIE.json').read_text(encoding='utf8'))
          expected=sum(2 if x['status'] in ('CHANGED','MOVED','UNCERTAIN') else 1 for x in d['records'])
          products=len(re.findall(rb'(?m)^#\d+\s*=\s*PRODUCT\(',raw))
          assert products==expected,(products,expected)
          assert b'NEXT_ASSEMBLY_USAGE_OCCURRENCE' not in raw
          assert not re.search(rb'(?m)^#\d+\s*=\s*SHAPE_REPRESENTATION\(',raw)
          assert b'ABSR1' not in raw
          assert 'plaski STEP' in (p/'RAPORT.html').read_text(encoding='utf8')
          print('R1112 safe STEP verified, products:',products)
          '@ | Set-Content (Join-Path $env:GITHUB_WORKSPACE 'R1112_STEP_CHECK.py') -Encoding UTF8
          python (Join-Path $env:GITHUB_WORKSPACE 'R1112_STEP_CHECK.py')
          if($LASTEXITCODE -ne 0){throw 'R1112 unsafe STEP export or report mismatch'}
