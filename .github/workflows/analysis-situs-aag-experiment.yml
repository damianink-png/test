name: Experimental AAG candidate benchmark (no production changes)
on:
  push:
    branches: [experiment/analysis-situs-aag-20261110]
    paths:
      - 'experiments/analysis_situs_aag/**'
      - '.github/workflows/analysis-situs-aag-experiment.yml'
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CAD kernel and Python wrapper
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install cadquery==2.6.1
          if($LASTEXITCODE -ne 0){throw 'CAD dependencies not available'}
      - name: Run unchanged baseline and AAG experiment
        shell: pwsh
        run: |
          python experiments/analysis_situs_aag/prototype.py evidence/aag-results.json
          if($LASTEXITCODE -ne 0){throw 'AAG benchmark failed'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analysis-situs-aag-candidate-benchmark
          path: evidence/
          if-no-files-found: warn
