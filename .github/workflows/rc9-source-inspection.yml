name: DS Compare RC9 source diagnostics snapshot
on:
  push:
    branches: [build/rc9-audyt-20261028]
    paths: ['.github/workflows/rc9-source-inspection.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact source for inspection
        run: |
          mkdir -p rc9-snapshot
          unzip -q DSCompare_RC9_AUDYT_20261028_ZRODLA.zip -d rc9-snapshot
          find rc9-snapshot -type f \( -name '*.py' -o -name '*.ps1' -o -name '*.yml' -o -name '*.toml' \) | wc -l
      - uses: actions/upload-artifact@v4
        with:
          name: RC9-source-snapshot
          path: |
            rc9-snapshot/**/*.py
            rc9-snapshot/**/*.ps1
            rc9-snapshot/**/*.yml
            rc9-snapshot/**/*.toml
          if-no-files-found: error
          retention-days: 3
