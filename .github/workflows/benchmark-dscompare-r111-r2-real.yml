name: DS Compare R11.1 R2 - real SO101/OLSK lazy BOM benchmark
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/benchmark-dscompare-r111-r2-real.yml'
      - 'patches/r111_lazy_patch.xz.b64'
      - 'patches/r111_bom_patch.xz.b64'
permissions:
  contents: read
jobs:
  public-cad:
    runs-on: windows-2022
    timeout-minutes: 24
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
      - name: Extract unchanged R10 baseline
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath DSCompare_V4_6_R10_ZRODLA.zip -DestinationPath . -Force
          if(!(Test-Path v46/DSCompareV3.py)){throw 'Missing baseline'}
      - name: Apply verified R11 optimization
        shell: pwsh
        run: |
          python -c "from pathlib import Path;import base64,lzma,hashlib; p=Path('patches/r11_patch.xz.b64').read_text('ascii').strip(); raw=lzma.decompress(base64.b64decode(p)); assert hashlib.sha256(raw).hexdigest()=='88920cc1350fc6daddb34b6c54b4d916e3b87b74d40a7e0693c4485fb45fca59'; Path('R11.patch').write_bytes(raw)"
          if($LASTEXITCODE -ne 0){throw 'Patch hash mismatch'}
          Set-Location v46
          git apply --check ../R11.patch
          if($LASTEXITCODE -ne 0){throw 'Cannot apply R11 patch'}
          git apply ../R11.patch
          if($LASTEXITCODE -ne 0){throw 'R11 patch failed'}
      - name: Apply verified R11.1 exact memory optimization
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -c "from pathlib import Path;import base64,lzma,hashlib; p=Path('patches/r111_bom_patch.xz.b64').read_text('ascii').strip(); raw=lzma.decompress(base64.b64decode(p)); assert hashlib.sha256(raw).hexdigest()=='ed641d5a37b5328dd6c03903e29c8407226bef15a85b203ad471565d3618355c'; Path('R111.patch').write_bytes(raw)"
          if($LASTEXITCODE -ne 0){throw 'Patch checksum failed'}
          Set-Location v46
          git apply -p2 --check ../R111.patch
          if($LASTEXITCODE -ne 0){throw 'R11.1 patch incompatible with R11'}
          git apply -p2 ../R111.patch
          if($LASTEXITCODE -ne 0){throw 'R11.1 patch failed'}
      - name: Apply verified lazy serialization optimization R2
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -c "from pathlib import Path;import base64,lzma,hashlib; p=Path('patches/r111_lazy_patch.xz.b64').read_text('ascii').strip(); raw=lzma.decompress(base64.b64decode(p)); assert hashlib.sha256(raw).hexdigest()=='2b98f4915a5ca00fcf7f2ba424a67ce2daf35ed4c13bc5dd2dc1e0f54d37f7f9'; Path('R111_LAZY.patch').write_bytes(raw)"
          if($LASTEXITCODE -ne 0){throw 'Patch hash mismatch'}
          Set-Location v46
          git apply -p2 --check ../R111_LAZY.patch
          if($LASTEXITCODE -ne 0){throw 'R2 patch incompatible'}
          git apply -p2 ../R111_LAZY.patch
          if($LASTEXITCODE -ne 0){throw 'R2 patch failed'}
      - name: Decode original benchmark and choose two pinned public assemblies
        shell: pwsh
        run: |
          python -c "from pathlib import Path;import lzma,base64,hashlib; data=lzma.decompress(base64.b64decode(Path('benchmarks/public_cad_r10_script.xz.b64').read_text('ascii'))); assert hashlib.sha256(data).hexdigest()=='e166550eec59a35c33b78433a3e39d91b4f3c7e21e5a3fa8a637e92f68a8050e'; s=data.decode('utf8'); assert s.count('for spec in CASES:')==1; s=s.replace('for spec in CASES:', 'for spec in CASES[1:3]:').replace('timeout=480','timeout=360'); Path('benchmarks/benchmark_public_cad_r11.py').write_text(s,encoding='utf8')"
          if($LASTEXITCODE -ne 0){throw 'Benchmark decode failed'}
      - name: Install geometry dependencies
        shell: pwsh
        run: |
          python -m pip install -r v46/requirements.txt
          if($LASTEXITCODE -ne 0){throw 'CAD dependency install failed'}
      - name: Analyze real SO101 and OLSK models on Windows
        shell: pwsh
        timeout-minutes: 19
        run: |
          python -u benchmarks/benchmark_public_cad_r11.py
          if($LASTEXITCODE -ne 0){throw 'Real-world CAD regression failed; see uploaded evidence'}
      - name: Upload all timing and STEP worker progress logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DSCompare-R11.1-R2-Public-CAD-Benchmark
          path: |
            real_cad_results/**/*.json
            real_cad_results/**/*.txt
          if-no-files-found: warn
          retention-days: 30
