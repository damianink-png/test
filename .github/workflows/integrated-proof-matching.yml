name: DS Compare integrated proof and matching - six real CAD cases
on:
  workflow_dispatch:
  push:
    branches:
      - fix/integrated-proof-matching
    paths:
      - patches/rc9/INTEGRATION_READY_20261027.txt
concurrency:
  group: integrated-proof-matching-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
env:
  PYTHONUTF8: '1'
  PYTHONUNBUFFERED: '1'
  PYTHONFAULTHANDLER: '1'
  QT_QPA_PLATFORM: offscreen
  DSCOMPARE_IMPORT_CACHE: 'off'
  DSCOMPARE_TRACE_BREP: '1'
  DSCOMPARE_SAVE_FAILED_BREP: '1'
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch pinned RC9 Stability source artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json"; "X-GitHub-Api-Version" = "2022-11-28" }
          Invoke-WebRequest -Uri 'https://api.github.com/repos/damianink-png/test/actions/artifacts/12650346634/zip' -Headers $headers -OutFile source_artifact.zip
          Expand-Archive source_artifact.zip -DestinationPath source_artifact -Force
          Expand-Archive source_artifact/DSCompare_RC9_STABILITY_SOURCES.zip -DestinationPath rc9 -Force
          if (-not (Test-Path rc9/src/dsac29/revision_overlap.py)) { throw 'Pinned RC9 source missing' }
          python patches/efficient/apply.py rc9/src/dsac29
          if ($LASTEXITCODE -ne 0) { throw 'Exact reuse patch failed' }
          python patches/rc9/patch_occt_obb.py rc9/src/dsac29
          if ($LASTEXITCODE -ne 0) { throw 'OCCT OBB integration failed' }
          python patches/rc9/patch_optional_revision.py rc9/src/dsac29/revision_overlap.py rc9/src/tests/test_stability.py
          if ($LASTEXITCODE -ne 0) { throw 'Fail-closed optional material proof patch failed' }
          python patches/rc9/patch_face_candidates.py rc9/src/dsac29/step_reexport_tolerance.py
          if ($LASTEXITCODE -ne 0) { throw 'Face candidates patch failed' }
          python patches/rc9/patch_micro_seams.py rc9/src/dsac29/parametric_identity.py
          if ($LASTEXITCODE -ne 0) { throw 'Micro-seams patch failed' }
          Copy-Item patches/rc9/test_face_candidates.py rc9/src/tests/test_face_candidates.py
          Copy-Item patches/rc9/brep_safety.py rc9/src/dsac29/brep_safety.py
          Copy-Item patches/rc9/material_deltas_safe.py rc9/src/dsac29/material_deltas.py
          python patches/rc9/patch_occt_pipeline.py rc9/src/dsac29
          if ($LASTEXITCODE -ne 0) { throw 'Integrated OCCT safety and alignment patch failed' }
          Copy-Item patches/rc9/test_occt_integration.py rc9/src/tests/test_occt_integration.py
          Copy-Item patches/rc9/safe_boolean_worker.py rc9/src/dsac29/safe_boolean_worker.py
          Copy-Item patches/rc9/test_safe_boolean_worker.py rc9/src/tests/test_safe_boolean_worker.py
          python patches/efficient/apply_controls.py rc9/src/dsac29
          if ($LASTEXITCODE -ne 0) { throw 'Preview controls patch failed' }
          node patches/efficient/test_preview_controls.cjs rc9/src/dsac29/preview_template.html
          if ($LASTEXITCODE -ne 0) { throw 'Preview behavior regression' }

          Copy-Item patches/efficient/test_efficient.py rc9/src/tests/test_efficient.py
          Copy-Item patches/efficient/test_robust_translation.py rc9/src/tests/test_robust_translation.py
          # Tests import the installed package, never a sibling source copy.
          (Get-Content rc9/src/tests/test_robust_translation.py -Raw).Replace('from robust_translation import', 'from dsac29.robust_translation import') | Set-Content rc9/src/tests/test_robust_translation.py -Encoding utf8
          python patches/rc9/integrate_deferred_translation.py rc9/src/dsac29/deferred_alignment.py
          if ($LASTEXITCODE -ne 0) { throw 'Automatic deferred alignment patch failed' }
          python -m py_compile rc9/src/dsac29/deferred_alignment.py
          if ($LASTEXITCODE -ne 0) { throw 'Deferred alignment syntax invalid' }
          python patches/rc9/integrate_translation.py rc9/src/dsac29/alignment.py
          if ($LASTEXITCODE -ne 0) { throw 'Robust translation integration failed' }
          python -m py_compile rc9/src/dsac29/robust_translation.py rc9/src/dsac29/alignment.py
          if ($LASTEXITCODE -ne 0) { throw 'Alignment syntax failed' }
          python -m py_compile rc9/src/dsac29/revision_overlap.py
          if ($LASTEXITCODE -ne 0) { throw 'RC9 patch syntax invalid' }
      - name: Install and run small regressions
        shell: pwsh
        working-directory: rc9/src
        run: |
          ./BUDUJ_WINDOWS.ps1 -InstallOnly
          if ($LASTEXITCODE -ne 0) { throw 'Dependencies failed' }
          python -m pip install pytest
          if ($LASTEXITCODE -ne 0) { throw 'pytest install failed' }
          python -m pytest -q tests/test_stability.py tests/test_efficient.py tests/test_robust_translation.py tests/test_face_candidates.py tests/test_safe_boolean_worker.py tests/test_occt_integration.py --junitxml=stability-tests.xml
          if ($LASTEXITCODE -ne 0) { throw 'RC9 stability tests failed' }
          # TESTUJ.py ships with a 240 s aggregate timeout, too short for the
          # full native B-Rep suite on a shared Windows runner. Keep every test.
          $testRunner = Get-Content TESTUJ.py -Raw
          if (-not $testRunner.Contains('timeout=240')) { throw 'Unexpected TESTUJ.py: cannot safely adjust aggregate timeout' }
          $testRunner = $testRunner.Replace('timeout=240', 'timeout=1800').Replace("'-q'", "'-vv','--junitxml=full-regressions.xml'")
          Set-Content TESTUJ.py -Value $testRunner -Encoding utf8
          python -u TESTUJ.py
          if ($LASTEXITCODE -ne 0) { throw 'Small regressions failed' }
      - name: Preserve small regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: INTEGRATED-PROOF-small-regression-diagnostics
          path: |
            rc9/src/stability-tests.xml
            rc9/src/full-regressions.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Build patched RC9
        shell: pwsh
        working-directory: rc9/src
        run: |
          ./BUDUJ_WINDOWS.ps1 -NoInstall
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          if (-not (Test-Path dist/DSCompare/DSCompare.exe)) { throw 'No EXE' }
      - name: Package exact patched sources
        shell: pwsh
        run: |
          $sourceItems = Get-ChildItem rc9/src | Where-Object { $_.Name -notin @('dist','build','.venv','__pycache__') }
          Compress-Archive -Path $sourceItems.FullName -DestinationPath DSCompare-Efficient-Sources.zip
      - uses: actions/upload-artifact@v4
        with:
          name: INTEGRATED-PROOF-sources
          path: DSCompare-Efficient-Sources.zip
      - uses: actions/upload-artifact@v4
        with:
          name: INTEGRATED-PROOF-FALLBACK-Windows-x64
          path: rc9/src/dist/DSCompare/**
          if-no-files-found: error
          retention-days: 14
  cad:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        model: [v2, trident]
        case: [revision, shift, revision_shift]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: INTEGRATED-PROOF-FALLBACK-Windows-x64
          path: app
      - name: Restore identical RC9 test scripts and dependencies
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json"; "X-GitHub-Api-Version" = "2022-11-28" }
          Invoke-WebRequest -Uri 'https://api.github.com/repos/damianink-png/test/actions/artifacts/12650346634/zip' -Headers $headers -OutFile source_artifact.zip
          Expand-Archive source_artifact.zip -DestinationPath source_artifact -Force
          Expand-Archive source_artifact/DSCompare_RC9_STABILITY_SOURCES.zip -DestinationPath rc9 -Force
          python -m pip install 'cadquery-ocp==7.9.3.1.1' 'numpy>=1.26,<3'
          if ($LASTEXITCODE -ne 0) { throw 'CAD test dependencies failed' }
          ./ci/rc10_diagnostics.ps1 -OutputDirectory diagnostics
          $revisionScript = 'rc9/src/ci/real_revision_without_shift.py'
          $revisionText = Get-Content $revisionScript -Raw
          if (-not $revisionText.Contains(",'--no-bom'")) { throw 'Revision BOM CI contract changed' }
          $revisionText = $revisionText.Replace(",'--no-bom'", '')
          Set-Content -Path $revisionScript -Value $revisionText -Encoding utf8
      - name: Run real CAD assembly scenario
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONPATH = (Resolve-Path rc9/src).Path
          $case = '${{ matrix.case }}'
          $model = '${{ matrix.model }}'
          New-Item -ItemType Directory -Path evidence -Force | Out-Null
          $ramPath = Join-Path (Resolve-Path evidence).Path 'ram-samples.csv'
          Set-Content -Path $ramPath -Value 'utc,combined_working_set_bytes,max_process_working_set_bytes,process_count'
          $sampler = Start-Job -ArgumentList $ramPath -ScriptBlock {
            param($path)
            while ($true) {
              try {
                $p = @(Get-Process -Name DSCompare -ErrorAction SilentlyContinue)
                if ($p.Count -gt 0) {
                  $sum = ($p | Measure-Object -Property WorkingSet64 -Sum).Sum
                  $max = ($p | Measure-Object -Property WorkingSet64 -Maximum).Maximum
                  $stamp = [DateTime]::UtcNow.ToString('o')
                  Add-Content -Path $path -Value "$stamp,$sum,$max,$($p.Count)"
                }
              } catch {}
              Start-Sleep -Seconds 2
            }
          }
          try {
            if ($case -eq 'revision') {
              python rc9/src/ci/real_revision_without_shift.py app/DSCompare.exe $model
            } else {
              python rc9/src/ci/large_exe.py app/DSCompare.exe $model $case
            }
            $exitCode = $LASTEXITCODE
          } finally {
            Stop-Job $sampler -ErrorAction SilentlyContinue
            Remove-Job $sampler -Force -ErrorAction SilentlyContinue
          }
          $samples = @(Import-Csv $ramPath)
          if ($samples.Count -gt 0) {
            $peak = ($samples | Measure-Object -Property combined_working_set_bytes -Maximum).Maximum
            Write-Host "SAMPLED_COMBINED_PEAK_WORKING_SET_BYTES=$peak"
          }
          if ($exitCode -ne 0) { throw "Real CAD $model $case failed" }
      - name: Audit real STEP HTML report and revision BOM artifacts
        shell: pwsh
        run: |
          python patches/rc9/audit_artifacts.py evidence '${{ matrix.case }}'
          if ($LASTEXITCODE -ne 0) { throw 'Real output artifact audit failed' }
      - name: Preserve real export and crash evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: INTEGRATED-PROOF-${{ matrix.model }}-${{ matrix.case }}
          path: |
            evidence/**
            diagnostics/**
          if-no-files-found: warn
          retention-days: 14


