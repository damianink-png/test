name: DS Compare R11.2 - SO101 distinct STEP SHA benchmark
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/benchmark-dscompare-r112-so101-distinct.yml'
      - 'benchmarks/benchmark_r112_so101_distinct.py'
permissions:
  contents: read
jobs:
  public-cad:
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
      - name: Extract unchanged R10 baseline
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath DSCompare_V4_6_R10_ZRODLA.zip -DestinationPath . -Force
          if(!(Test-Path v46/DSCompareV3.py)){throw 'Missing baseline'}
      - name: Apply verified R11 optimization
        shell: pwsh
        run: |
          python -c "from pathlib import Path;import base64,lzma,hashlib; p=Path('patches/r11_patch.xz.b64').read_text('ascii').strip(); raw=lzma.decompress(base64.b64decode(p)); assert hashlib.sha256(raw).hexdigest()=='88920cc1350fc6daddb34b6c54b4d916e3b87b74d40a7e0693c4485fb45fca59'; Path('R11.patch').write_bytes(raw)"
          if($LASTEXITCODE -ne 0){throw 'Patch hash mismatch'}
          Set-Location v46
          git apply --check ../R11.patch
          if($LASTEXITCODE -ne 0){throw 'Cannot apply R11 patch'}
          git apply ../R11.patch
          if($LASTEXITCODE -ne 0){throw 'R11 patch failed'}
      - name: Apply verified R11.1 exact memory optimization
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -c "from pathlib import Path;import base64,lzma,hashlib; p=Path('patches/r111_bom_patch.xz.b64').read_text('ascii').strip(); raw=lzma.decompress(base64.b64decode(p)); assert hashlib.sha256(raw).hexdigest()=='ed641d5a37b5328dd6c03903e29c8407226bef15a85b203ad471565d3618355c'; Path('R111.patch').write_bytes(raw)"
          if($LASTEXITCODE -ne 0){throw 'Patch checksum failed'}
          Set-Location v46
          git apply -p2 --check ../R111.patch
          if($LASTEXITCODE -ne 0){throw 'R11.1 patch incompatible with R11'}
          git apply -p2 ../R111.patch
          if($LASTEXITCODE -ne 0){throw 'R11.1 patch failed'}
      - name: Apply verified lazy serialization optimization R2
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -c "from pathlib import Path;import base64,lzma,hashlib; p=Path('patches/r111_lazy_patch.xz.b64').read_text('ascii').strip(); raw=lzma.decompress(base64.b64decode(p)); assert hashlib.sha256(raw).hexdigest()=='2b98f4915a5ca00fcf7f2ba424a67ce2daf35ed4c13bc5dd2dc1e0f54d37f7f9'; Path('R111_LAZY.patch').write_bytes(raw)"
          if($LASTEXITCODE -ne 0){throw 'Patch hash mismatch'}
          Set-Location v46
          git apply -p2 --check ../R111_LAZY.patch
          if($LASTEXITCODE -ne 0){throw 'R2 patch incompatible'}
          git apply -p2 ../R111_LAZY.patch
          if($LASTEXITCODE -ne 0){throw 'R2 patch failed'}
      - name: Apply R11.2 verified cross-revision BOM reuse
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -c "from pathlib import Path;import lzma,base64,hashlib; raw=lzma.decompress(base64.b64decode(Path('patches/r112_shared_bom_patch.xz.b64').read_text('ascii'))); assert hashlib.sha256(raw).hexdigest()=='70c85039997380f488d7a94b412c502df194ec711f04f1b49117f49efd1559f0'; Path('R112.patch').write_bytes(raw)"
          if($LASTEXITCODE -ne 0){throw 'R11.2 patch hash mismatch'}
          Set-Location v46
          git apply --check ../R112.patch
          if($LASTEXITCODE -ne 0){throw 'R11.2 patch incompatible'}
          git apply ../R112.patch
          if($LASTEXITCODE -ne 0){throw 'R11.2 patch failed'}
      - name: Reconstruct and verify all R11.2 patches outside the Git worktree
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $workspace=$env:GITHUB_WORKSPACE
          python -c "from pathlib import Path;import base64,lzma,hashlib; raw=lzma.decompress(base64.b64decode(Path('patches/r112_bom_guard.xz.b64').read_text('ascii'))); assert hashlib.sha256(raw).hexdigest()=='198dc4c21236e115b64ac36a96550959d58782ba862fea43359cf95db82301d7'; Path('R112_GUARD.patch').write_bytes(raw)"
          if($LASTEXITCODE -ne 0){throw 'R11.2 guard checksum mismatch'}
          $isolated=Join-Path $env:RUNNER_TEMP 'r112-independent-source'
          Expand-Archive -LiteralPath (Join-Path $workspace 'DSCompare_V4_6_R10_ZRODLA.zip') -DestinationPath $isolated -Force
          Set-Location (Join-Path $isolated 'v46')
          foreach($stage in @(@('R11.patch',1),@('R111.patch',2),@('R111_LAZY.patch',2),@('R112.patch',1),@('R112_GUARD.patch',1))){
            $patch=Join-Path $workspace $stage[0]
            $strip=[int]$stage[1]
            & git apply "-p$strip" --check $patch
            if($LASTEXITCODE -ne 0){throw "R11.2 patch check failed: $patch"}
            & git apply "-p$strip" $patch
            if($LASTEXITCODE -ne 0){throw "R11.2 patch apply failed: $patch"}
          }
          $localSource=Join-Path $isolated 'v46'
          $dest=Join-Path $workspace 'v46'
          Copy-Item -Path "$localSource/*" -Destination $dest -Recurse -Force
          Set-Location $workspace
          python -c "from pathlib import Path; p=Path('v46/dsac29/report.py'); s=p.read_text(encoding='utf8'); assert 'def reuse_verified_bom_groups' in s and 'transferred = None if bom_warnings else' in s; print('R112 source verified:',p.resolve())"
          if($LASTEXITCODE -ne 0){throw 'R11.2 module not reconstructed'}
      - name: Decode original benchmark and choose two pinned public assemblies
        shell: pwsh
        run: |
          python -c "from pathlib import Path;import lzma,base64,hashlib; data=lzma.decompress(base64.b64decode(Path('benchmarks/public_cad_r10_script.xz.b64').read_text('ascii'))); assert hashlib.sha256(data).hexdigest()=='e166550eec59a35c33b78433a3e39d91b4f3c7e21e5a3fa8a637e92f68a8050e'; s=data.decode('utf8'); assert s.count('for spec in CASES:')==1; s=s.replace('for spec in CASES:', 'for spec in CASES[1:3]:').replace('timeout=480','timeout=360'); Path('benchmarks/benchmark_public_cad_r11.py').write_text(s,encoding='utf8')"
          if($LASTEXITCODE -ne 0){throw 'Benchmark decode failed'}
      - name: Install geometry dependencies
        shell: pwsh
        run: |
          python -m pip install -r v46/requirements.txt
          if($LASTEXITCODE -ne 0){throw 'CAD dependency install failed'}
      - name: Assert R11.2 code loaded in Python runner
        shell: pwsh
        run: |
          python -c "import sys;from pathlib import Path;sys.path.insert(0,str(Path('v46').resolve()));import dsac29.report as m;print('REPORT_MODULE=',m.__file__);print('HAS_REUSE=',hasattr(m,'reuse_verified_bom_groups'));assert hasattr(m,'reuse_verified_bom_groups'), 'R112 not imported';print('REPORT_SOURCE_MATCH=', 'BOM B: ponowne użycie zweryfikowanych grup A' in Path(m.__file__).read_text(encoding='utf-8'))"
          if($LASTEXITCODE -ne 0){throw 'Wrong report module in benchmark'}
      - name: Validate reuse only for fully proven cross-file unchanged mappings
        shell: pwsh
        run: |
          python -u benchmarks/verify_r112_crossfile.py
          if($LASTEXITCODE -ne 0){throw 'R11.2 cross-file BOM regression failed'}
      - name: Benchmark SO101 with different STEP bytes but unchanged CAD geometry
        shell: pwsh
        timeout-minutes: 19
        run: |
          python -u benchmarks/benchmark_r112_so101_distinct.py
          if($LASTEXITCODE -ne 0){throw 'R11.2 distinct SO101 CAD benchmark failed'}
      - name: Upload all timing and STEP worker progress logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DSCompare-R11.2-SO101-Distinct-File-Benchmark
          path: |
            real_cad_results/**/*.json
            real_cad_results/**/*.txt
          if-no-files-found: warn
          retention-days: 30
