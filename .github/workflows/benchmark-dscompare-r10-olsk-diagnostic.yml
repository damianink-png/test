name: DS Compare R10 - Diagnose real CNC import and comparison stall
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/benchmark-dscompare-r10-olsk-diagnostic.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-2022
    timeout-minutes: 12
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
      - name: Extract unchanged R10 code
        shell: pwsh
        run: Expand-Archive -LiteralPath DSCompare_V4_6_R10_ZRODLA.zip -DestinationPath . -Force
      - name: Decode and instrument 90-second OLSK test
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import hashlib,base64,lzma
          raw=lzma.decompress(base64.b64decode(Path('benchmarks/public_cad_r10_script.xz.b64').read_text('ascii')))
          assert hashlib.sha256(raw).hexdigest()=='e166550eec59a35c33b78433a3e39d91b4f3c7e21e5a3fa8a637e92f68a8050e'
          t=raw.decode('utf8')
          changes={
              'for spec in CASES:': 'for spec in CASES[2:3]:',
              'limit=2500,timeout=480)': 'limit=2500,timeout=90)',
              'cmd=[sys.executable,str(SOURCE': "cmd=[sys.executable,'-u',str(SOURCE",
              "shutil.rmtree(directory/'result',ignore_errors=True)": "(directory/'progress.txt').write_text((directory/'result'/'_POSTEP_V37.jsonl').read_text(encoding='utf-8') if (directory/'result'/'_POSTEP_V37.jsonl').exists() else 'No progress message emitted',encoding='utf-8'); shutil.rmtree(directory/'result',ignore_errors=True)",
          }
          for a,b in changes.items():
              assert t.count(a)==1,a
              t=t.replace(a,b)
          Path('benchmarks/benchmark_public_cad_r10.py').write_text(t,encoding='utf8')
          '@ | Set-Content -Path instrument_benchmark.py -Encoding utf8
          python instrument_benchmark.py
          if($LASTEXITCODE -ne 0){throw 'Failed to instrument test'}
      - name: Install CAD libraries
        shell: pwsh
        run: |
          python -m pip install -r v46/requirements.txt
          if($LASTEXITCODE -ne 0){throw 'Install failed'}
      - name: Collect progress of stalled original STEP
        shell: pwsh
        timeout-minutes: 6
        run: |
          python -u benchmarks/benchmark_public_cad_r10.py
          if($LASTEXITCODE -ne 0){Write-Host 'Observed real-model failure (see artifact)'}
      - name: Upload worker progress including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DSCompare-R10-OLSK-90sec-Diagnostic
          path: |
            real_cad_results/**/*.txt
            real_cad_results/**/*.json
          if-no-files-found: warn
          retention-days: 30
