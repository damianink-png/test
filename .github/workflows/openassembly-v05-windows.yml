name: OpenAssembly v0.6 - Windows build and large STEP regression
on:
  push:
    branches: ['feature/openassembly-v05-inspection']
    paths:
      - 'OpenAssemblyCompare_sources.tar.xz.b64'
      - '.github/workflows/openassembly-v05-windows.yml'
      - 'openassembly_ci/apply_roundtrip_recovery.py'
      - 'openassembly_optimizations/apply_xcaf_geometry_cache.py'
      - 'openassembly_ci/apply_world_faces_recovery.py'
      - 'openassembly_ci/test_world_faces_recovery.py'
      - 'openassembly_ci/apply_bbox_roundtrip_fix.py'
      - 'openassembly_ci/apply_gui_step_button.py'
      - 'openassembly_ci/apply_bom_browser.py'
      - 'openassembly_ci/test_roundtrip_recovery.py'
      - 'openassembly_ci/test_bbox_roundtrip.py'
      - 'openassembly_ci/test_xcaf_cache.py'
      - 'openassembly_ci/public_revision.py'
  workflow_dispatch:
    inputs:
      full_cad:
        description: 'Run all six large Voron/Trident CAD scenarios'
        type: boolean
        default: true
        required: false
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      cad: ${{ steps.filter.outputs.cad }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            cad:
              - 'OpenAssemblyCompare_sources.tar.xz.b64'
              - 'openassembly_ci/apply_roundtrip_recovery.py'
              - 'openassembly_optimizations/apply_xcaf_geometry_cache.py'
              - 'openassembly_ci/apply_world_faces_recovery.py'
              - 'openassembly_ci/apply_bbox_roundtrip_fix.py'
              - 'openassembly_ci/public_revision.py'
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Extract independent v0.6 sources
        shell: pwsh
        run: |
          $z=(Get-Content -Raw OpenAssemblyCompare_sources.tar.xz.b64).Trim()
          [IO.File]::WriteAllBytes('source.tar.xz',[Convert]::FromBase64String($z))
          python -c "import tarfile;tarfile.open('source.tar.xz','r:xz').extractall('source/OpenAssemblyCompare',filter='data')"
          python openassembly_ci/apply_roundtrip_recovery.py source/OpenAssemblyCompare
          if ($LASTEXITCODE -ne 0) {throw 'Roundtrip patch failed'}
          python openassembly_ci/apply_world_faces_recovery.py source/OpenAssemblyCompare
          if ($LASTEXITCODE -ne 0) {throw 'World faces patch failed'}
          python openassembly_optimizations/apply_xcaf_geometry_cache.py source/OpenAssemblyCompare
          if ($LASTEXITCODE -ne 0) {throw 'XCAF cache patch failed'}
          python openassembly_ci/apply_bbox_roundtrip_fix.py source/OpenAssemblyCompare
          if ($LASTEXITCODE -ne 0) {throw 'Bounding box patch failed'}
          python openassembly_ci/apply_gui_step_button.py source/OpenAssemblyCompare
          if ($LASTEXITCODE -ne 0) {throw 'GUI patch failed'}
          python openassembly_ci/apply_bom_browser.py source/OpenAssemblyCompare
          if ($LASTEXITCODE -ne 0) {throw 'OpenAssembly source patch failed'}
          Copy-Item openassembly_ci/test_roundtrip_recovery.py source/OpenAssemblyCompare/tests/test_roundtrip_recovery.py
          Copy-Item openassembly_ci/test_world_faces_recovery.py source/OpenAssemblyCompare/tests/test_world_faces_recovery.py
          Copy-Item openassembly_ci/test_bbox_roundtrip.py source/OpenAssemblyCompare/tests/test_bbox_roundtrip.py
          Copy-Item openassembly_ci/test_xcaf_cache.py source/OpenAssemblyCompare/tests/test_xcaf_cache.py
          if (-not (Test-Path source/OpenAssemblyCompare/pyproject.toml)) {throw 'Missing pyproject'}
      - name: Publish extracted OpenAssembly source snapshot for revision-test development
        uses: actions/upload-artifact@v4
        with:
          name: OpenAssembly-v06-source-snapshot
          path: source/OpenAssemblyCompare/**
          retention-days: 30
          if-no-files-found: error
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install dependencies and regression suite
        working-directory: source/OpenAssemblyCompare
        shell: pwsh
        run: |
          python -m pip install -e '.[test,package]' psutil
          if ($LASTEXITCODE -ne 0) {throw 'Dependency installation failed'}
          python -X faulthandler -m pytest tests -q -ra --durations=20 --junitxml=pytest-results.xml
          if ($LASTEXITCODE -ne 0) {throw 'Regression suite failed'}
      - name: Upload regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenAssembly-v06-pytest-diagnostics
          path: source/OpenAssemblyCompare/pytest-results.xml
          retention-days: 30
          if-no-files-found: warn
      - name: Compile GUI EXE
        working-directory: source/OpenAssemblyCompare
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name OpenAssemblyCompare --collect-all OCP --hidden-import openassembly.boolean_ops launch_gui.py
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path dist/OpenAssemblyCompare/OpenAssemblyCompare.exe)) {throw 'GUI compile failed'}
      - name: Compile CLI EXE
        working-directory: source/OpenAssemblyCompare
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --console --name OpenAssemblyCompareCLI --collect-all OCP --hidden-import openassembly.boolean_ops launch_cli.py
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path dist/OpenAssemblyCompareCLI/OpenAssemblyCompareCLI.exe)) {throw 'CLI compile failed'}
      - name: Capture actual Windows GUI screenshot (diagnostic)
        shell: pwsh
        continue-on-error: true
        run: |
          @'
          import subprocess, time, pathlib, os
          from PIL import ImageGrab
          exe = pathlib.Path('source/OpenAssemblyCompare/dist/OpenAssemblyCompare/OpenAssemblyCompare.exe').resolve()
          out = pathlib.Path('evidence/gui-actual.png')
          out.parent.mkdir(parents=True, exist_ok=True)
          p = subprocess.Popen([str(exe)], cwd=str(exe.parent))
          try:
              time.sleep(12)
              if p.poll() is not None:
                  raise RuntimeError(f'GUI exited before screenshot: {p.returncode}')
              image = ImageGrab.grab(all_screens=True)
              if image.getbbox() is None:
                  raise RuntimeError('Empty desktop capture')
              image.save(out)
              print('Captured real GUI desktop:', out, image.size)
          finally:
              p.terminate()
              try: p.wait(timeout=5)
              except subprocess.TimeoutExpired: p.kill()
          '@ | Set-Content -Encoding utf8 capture_gui.py
          python -m pip install Pillow
          python capture_gui.py
          if ($LASTEXITCODE -ne 0) {throw 'Actual GUI capture unavailable on CI runner'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OpenAssembly-v06-actual-GUI-screenshot
          path: evidence/gui-actual.png
          retention-days: 30
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: OpenAssemblyCompare-v06-Windows-GUI
          path: source/OpenAssemblyCompare/dist/OpenAssemblyCompare/**
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: OpenAssemblyCompare-v06-Windows-CLI
          path: source/OpenAssemblyCompare/dist/OpenAssemblyCompareCLI/**
          retention-days: 30
          if-no-files-found: error
  large-cad:
    needs: [changes, build]
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.full_cad) || (github.event_name == 'push' && needs.changes.outputs.cad == 'true') }}
    runs-on: windows-2022
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        model: [voron2, trident]
        scenario: [identical, shift, revision]
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact tested source
        shell: pwsh
        run: |
          $z=(Get-Content -Raw OpenAssemblyCompare_sources.tar.xz.b64).Trim()
          [IO.File]::WriteAllBytes('source.tar.xz',[Convert]::FromBase64String($z))
          python -c "import tarfile;tarfile.open('source.tar.xz','r:xz').extractall('source/OpenAssemblyCompare',filter='data')"
          python openassembly_ci/apply_roundtrip_recovery.py source/OpenAssemblyCompare
          if ($LASTEXITCODE -ne 0) {throw 'Roundtrip patch failed'}
          python openassembly_ci/apply_world_faces_recovery.py source/OpenAssemblyCompare
          if ($LASTEXITCODE -ne 0) {throw 'World faces patch failed'}
          python openassembly_optimizations/apply_xcaf_geometry_cache.py source/OpenAssemblyCompare
          if ($LASTEXITCODE -ne 0) {throw 'XCAF cache patch failed'}
          python openassembly_ci/apply_bbox_roundtrip_fix.py source/OpenAssemblyCompare
          if ($LASTEXITCODE -ne 0) {throw 'Bounding box patch failed'}
          python openassembly_ci/apply_gui_step_button.py source/OpenAssemblyCompare
          if ($LASTEXITCODE -ne 0) {throw 'GUI patch failed'}
          python openassembly_ci/apply_bom_browser.py source/OpenAssemblyCompare
          if ($LASTEXITCODE -ne 0) {throw 'OpenAssembly source patch failed'}
          Copy-Item openassembly_ci/test_roundtrip_recovery.py source/OpenAssemblyCompare/tests/test_roundtrip_recovery.py
          Copy-Item openassembly_ci/test_world_faces_recovery.py source/OpenAssemblyCompare/tests/test_world_faces_recovery.py
          Copy-Item openassembly_ci/test_bbox_roundtrip.py source/OpenAssemblyCompare/tests/test_bbox_roundtrip.py
          Copy-Item openassembly_ci/test_xcaf_cache.py source/OpenAssemblyCompare/tests/test_xcaf_cache.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install test CAD dependencies
        shell: pwsh
        run: |
          python -m pip install -e 'source/OpenAssemblyCompare[test]' psutil
          if ($LASTEXITCODE -ne 0) {throw 'Dependencies failed'}
      - uses: actions/download-artifact@v4
        with:
          name: OpenAssemblyCompare-v06-Windows-CLI
          path: app
      - name: Record CAD input and source provenance
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path evidence | Out-Null
          git rev-parse HEAD | Out-File -Encoding utf8 evidence/source-commit.txt
          Get-FileHash OpenAssemblyCompare_sources.tar.xz.b64 -Algorithm SHA256 | Format-List | Out-File -Encoding utf8 evidence/source-sha256.txt
      - name: Run real public assembly regression (identical or shifted)
        if: matrix.scenario != 'revision'
        shell: pwsh
        env:
          PYTHONUTF8: '1'
          PYTHONFAULTHANDLER: '1'
        run: |
          python source/OpenAssemblyCompare/benchmarks/public_voron.py --model ${{ matrix.model }} --scenario ${{ matrix.scenario }} --output evidence/${{ matrix.model }}-${{ matrix.scenario }} --executable app/OpenAssemblyCompareCLI.exe --timeout 3000
          if ($LASTEXITCODE -ne 0) {throw 'CAD regression failed'}
      - name: Run controlled revision regression on original public CAD assembly
        if: matrix.scenario == 'revision'
        shell: pwsh
        env:
          PYTHONUTF8: '1'
          PYTHONFAULTHANDLER: '1'
        run: |
          python openassembly_ci/public_revision.py --model ${{ matrix.model }} --output evidence/${{ matrix.model }}-revision --executable app/OpenAssemblyCompareCLI.exe --timeout 3000
          if ($LASTEXITCODE -ne 0) {throw 'Controlled revision regression failed'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OpenAssembly-v06-evidence-${{ matrix.model }}-${{ matrix.scenario }}
          path: |
            evidence/source-commit.txt
            evidence/source-sha256.txt
            evidence/**/RESULT.json
            evidence/**/CLASSIFICATION_DIAGNOSTICS.json
            evidence/**/worker.log
            evidence/**/comparison/comparison.json
            evidence/**/comparison/BOM_ZMIANY.csv
            evidence/**/comparison/CZASY_ANALIZY.json
            evidence/**/comparison/RAPORT_3D.html
            evidence/**/comparison/BOM_ROZNICE.csv
            evidence/**/comparison/BOM_PRZEGLAD.html
          retention-days: 30
          if-no-files-found: warn
# v0.6 inspection regression: pytest + original Voron/Trident identical and shift scenarios
