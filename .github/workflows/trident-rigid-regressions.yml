name: DS Compare Trident rigid isolation regressions
on:
  push:
    branches: [codex/rc9-palette-20261102]
    paths:
      - '.github/workflows/trident-rigid-regressions.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install OCCT and restore source
        run: |
          python -m pip install 'cadquery-ocp==7.9.3.1.1' 'numpy>=1.26,<3' 'scipy>=1.10' 'trimesh>=4' 'pillow>=10'
          python -m zipfile -e DSCompare_RC9_KOMPLET_ZRODLA.zip .
          python review/fix06/ci/patch_trident_native_failures.py dscompare_rc9_manual/dsac29/compare.py
          python review/fix06/ci/patch_trident_rigid_isolation.py dscompare_rc9_manual/dsac29/compare.py
          python -m py_compile review/fix06/ci/patch_trident_rigid_isolation.py dscompare_rc9_manual/dsac29/compare.py
      - name: Assert no in-process native rigid operation for large assemblies
        run: |
          PYTHONPATH=dscompare_rc9_manual:review/fix06/ci python -m unittest -v test_trident_native_failures
