name: R22.1 diagnostics source snapshot
on:
  push:
    branches:
      - diagnostics/r22-1-shift-tests-20261025
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact R22.1 sources used for EXE
        run: |
          mkdir -p source
          python -m zipfile -e DSCompare_1_0_R22_1_ZRODLA_GITHUB.zip source
          find source -type f | sort > source/MANIFEST.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DSCompare-R22.1-sources-diagnostics
          path: source/**
          if-no-files-found: error
          retention-days: 7
