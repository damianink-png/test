name: RC9 micro-seam strict proof experiment
# Validate multiple tiny seam fragments with a fixed aggregate geometric budget.
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/rc9-micro-seam-experiment.yml']
permissions:
  contents: read
  actions: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'cadquery-ocp==7.9.3.1.1' 'numpy>=1.26,<3' pytest
      - name: Fetch exact RC9 source and Trident failed shapes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/damianink-png/test/actions/artifacts/12650346634/zip > /tmp/src.zip
          mkdir -p /tmp/src rc9
          unzip -q /tmp/src.zip -d /tmp/src
          unzip -q /tmp/src/DSCompare_RC9_STABILITY_SOURCES.zip -d rc9
          gh api repos/damianink-png/test/actions/artifacts/12699485972/zip > /tmp/failed.zip
      - name: Apply only experimental micro-seam patch
        run: |
          python patches/rc9/patch_micro_seams.py rc9/src/dsac29/parametric_identity.py
          # EXPERIMENT ONLY: retain per-edge 0.0025 mm, test aggregate 0.005 mm.
          python - <<'PY'
          from pathlib import Path
          p=Path('rc9/src/dsac29/parametric_identity.py')
          s=p.read_text(encoding='utf-8')
          old='sum(spans[k] for k in tiny)>tol*2'
          assert s.count(old)==1
          p.write_text(s.replace(old,'sum(spans[k] for k in tiny)>tol*4'),encoding='utf-8')
          print('EXPERIMENT_ONLY: aggregate micro-seam budget 0.005 mm; production remains 0.0025 mm')
          PY
          python patches/rc9/patch_face_candidates.py rc9/src/dsac29/step_reexport_tolerance.py
          python -m py_compile rc9/src/dsac29/parametric_identity.py rc9/src/dsac29/step_reexport_tolerance.py
      - name: Strict negative and positive geometry regression
        env:
          PYTHONPATH: rc9/src
        run: |
          python -m pytest -q rc9/src/tests/test_r115_surface_negative_witness.py patches/rc9/test_face_candidates.py
      - name: Real native B-Rep independent proof, no Boolean
        env:
          PYTHONPATH: rc9/src
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'PY'
          import zipfile,tempfile,pathlib,signal
          from OCP.TopoDS import TopoDS_Shape
          from OCP.BRep import BRep_Builder
          from OCP.BRepTools import BRepTools
          # Trace the first remaining exact-trim failure after micro-seam cleanup.
          proof_path=pathlib.Path('rc9/src/dsac29/parametric_identity.py')
          code=proof_path.read_text(encoding='utf-8')
          probes={
              "if not surface_equal(fa[i],fb[j],face_data[i][4],tol):return False":
              "if not surface_equal(fa[i],fb[j],face_data[i][4],tol):print('MICRO_FAIL_SURFACE',i,j,flush=True);return False",
              "if len(wa)!=len(wb) or not wa:return False":
              "if len(wa)!=len(wb) or not wa:print('MICRO_FAIL_WIRE_COUNT',i,j,len(wa),len(wb),flush=True);return False",
              "if not options[-1]:return False":
              "if not options[-1]:print('MICRO_FAIL_WIRE',i,j,k,flush=True);return False",
              "if not perfect(options):return False":
              "if not perfect(options):print('MICRO_FAIL_ASSIGN',i,j,flush=True);return False",
          }
          for old,new in probes.items():
              assert old in code,old
              code=code.replace(old,new)
          proof_path.write_text(code,encoding='utf-8')
          from dsac29.geometry import describe
          from dsac29.step_reexport_tolerance import reexport_equivalent_world
          def read(p):
              s=TopoDS_Shape();assert BRepTools.Read_s(s,str(p),BRep_Builder());return s
          def alarm(*args):raise TimeoutError('strict proof exceeded budget')
          signal.signal(signal.SIGALRM,alarm)
          with zipfile.ZipFile('/tmp/failed.zip') as z,tempfile.TemporaryDirectory() as tmp:
              for n in (1,6,10,3,4,5,2):
                  pfx=f'evidence/comparison/FAILED_BREP/world_negative_{n:02d}'
                  a=pathlib.Path(tmp)/'A.brep';b=pathlib.Path(tmp)/'B.brep'
                  a.write_bytes(z.read(pfx+'/A.brep'));b.write_bytes(z.read(pfx+'/B.brep'))
                  pa=describe(read(a),'A','A');pb=describe(read(b),'B','B')
                  phases=[]
                  try:
                      signal.alarm(35)
                      result=reexport_equivalent_world(pa,pb,.01,allow_boolean=False,progress=phases.append)
                      signal.alarm(0)
                      print('MICRO_SEAM_PROOF',n,result,phases,flush=True)
                  except Exception as e:
                      signal.alarm(0)
                      print('MICRO_SEAM_ERROR',n,type(e).__name__,str(e),flush=True)
          PY
