name: DS Compare RC8 - aligned STEP reimport and six real CAD tests
on:
  push:
    branches: [fix/dscompare-rc8-step-restart]
    paths:
      - scripts/rc7_aligned_step_restart.py
      - scripts/rc7_aligned_step_restart_patch.py
      - tests/test_rc7_aligned_step_restart.py
      - .github/workflows/rc7-aligned-step-restart.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 50
    env:
      PYTHONUTF8: '1'
      PYTHONFAULTHANDLER: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Extract Work RC7 and apply safety, proof and aligned STEP restart patches
        shell: pwsh
        run: |
          python -m zipfile -e DSCompare_RC7_SOURCES.zip src
          if ($LASTEXITCODE -ne 0) { throw 'RC7 source extraction failed' }
          python scripts/rc7_parametric_proof_patch.py src
          if ($LASTEXITCODE -ne 0) { throw 'Parametric proof patch failed' }
          python scripts/rc7_alignment_only_common_guard.py src
          if ($LASTEXITCODE -ne 0) { throw 'Native Common guard patch failed' }
          Copy-Item scripts/rc7_aligned_step_restart.py src/dsac29/aligned_step_restart.py
          python scripts/rc7_aligned_step_restart_patch.py src
          if ($LASTEXITCODE -ne 0) { throw 'Aligned STEP patch failed' }
          Copy-Item tests/test_rc7_parametric_proof.py src/tests/test_rc7_parametric_proof.py
          Copy-Item tests/test_rc7_aligned_step_restart.py src/tests/test_rc7_aligned_step_restart.py
          Set-Content src/VERSION.txt 'DS Compare 1.0 R22.3 RC8 STEP restart'
          python -c "import json,pathlib; p=pathlib.Path('src/build_info.json'); d=json.loads(p.read_text()); d.update(revision='R22.3 RC8 STEP restart', validation_status='Development build; inspect six CAD results'); p.write_text(json.dumps(d,indent=2))"
      - name: Dependencies, roundtrip tests, full regression, Windows EXE, UI smoke
        working-directory: src
        shell: pwsh
        run: |
          ./BUDUJ_WINDOWS.ps1 -InstallOnly
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
          python -m pip install pytest
          python -m pytest -q tests/test_rc7_parametric_proof.py tests/test_rc7_aligned_step_restart.py
          if ($LASTEXITCODE -ne 0) { throw 'STEP round-trip unit tests failed' }
          python TESTUJ.py
          if ($LASTEXITCODE -ne 0) { throw 'Regression failed' }
          ./BUDUJ_WINDOWS.ps1 -NoInstall
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
          $p=Start-Process ./dist/DSCompare/DSCompare.exe -ArgumentList '--smoke-test-ui','UI_CHECK' -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path UI_CHECK/UI_OK.json)) { throw 'UI smoke failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: DSCompare-RC8-ALIGNED-STEP-Windows-x64
          path: src/dist/DSCompare/**
          if-no-files-found: error
          retention-days: 14
      - name: Package complete build sources
        shell: pwsh
        run: |
          python -c "import pathlib,zipfile; root=pathlib.Path('src'); z=zipfile.ZipFile('DSCompare_RC8_SOURCES.zip','w',zipfile.ZIP_DEFLATED); [z.write(p,p.relative_to(root)) for p in root.rglob('*') if p.is_file() and not any(x in ('dist','build','__pycache__','.pytest_cache','UI_CHECK') for x in p.relative_to(root).parts)]; z.close()"
      - uses: actions/upload-artifact@v4
        with:
          name: DSCompare-RC8-STEP-restart-sources
          path: DSCompare_RC8_SOURCES.zip
          if-no-files-found: error
  cad:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 80
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        model: [v2, trident]
        case: [shift, revision_shift, revision]
    env:
      PYTHONUTF8: '1'
      PYTHONFAULTHANDLER: '1'
      QT_QPA_PLATFORM: offscreen
      DSCOMPARE_REIMPORT_ALIGNED_STEP: '1'
      DSCOMPARE_IMPORT_CACHE: 'off'
      DSCOMPARE_TRACE_BREP: '1'
      DSCOMPARE_SAVE_FAILED_BREP: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: DSCompare-RC8-ALIGNED-STEP-Windows-x64
          path: app
      - name: Prepare original real CAD harness
        shell: pwsh
        run: |
          python -m zipfile -e DSCompare_RC7_SOURCES.zip src
          python -m pip install 'cadquery-ocp==7.9.3.1.1' 'numpy>=1.26,<3'
      - name: Run compiled Windows EXE on authentic large CAD
        shell: pwsh
        run: |
          $env:PYTHONPATH=(Resolve-Path src).Path
          if ('${{ matrix.case }}' -eq 'revision') {
            python src/ci/real_revision_without_shift.py app/DSCompare.exe ${{ matrix.model }}
          } else {
            python src/ci/large_exe.py app/DSCompare.exe ${{ matrix.model }} ${{ matrix.case }}
          }
          if ($LASTEXITCODE -ne 0) { throw 'Real CAD test failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RC8-ALIGNED-STEP-${{ matrix.model }}-${{ matrix.case }}
          path: evidence/**
          if-no-files-found: warn
          retention-days: 14
