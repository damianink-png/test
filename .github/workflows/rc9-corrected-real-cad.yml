name: DS Compare RC9 corrected ZIP real CAD tests
on:
  push:
    branches: [main, codex/rc9-boundary-ui-ci-20261030, codex/rc9-palette-20261102]
    paths:
      - '.github/workflows/rc9-corrected-real-cad.yml'
      - 'DSCompare_RC9_KOMPLET_ZRODLA.zip'
      - 'review/fix06/dsac29/**'
      - 'review/fix06/tests/test_semantic_palette_export.py'
      - 'review/fix06/ci/patch_common_exclusion_dispatch.py'
      - 'review/fix06/ci/patch_legacy_dual_failure_tests.py'
      - 'review/fix06/ci/patch_partial_audit.py'
      - 'review/fix06/ci/patch_openarm_auto_partial.py'
      - 'review/fix06/ci/patch_material_worker_failclosed.py'
      - 'review/fix06/ci/patch_gui_minimal.py'
      - 'review/fix06/ci/patch_legacy_ui_tests.py'
      - 'review/fix06/ci/patch_step_polish_names.py'
      - 'review/fix06/tests/test_gui_minimal.py'
      - 'review/fix06/tests/test_material_worker_failclosed.py'
      - 'review/fix06/tests/test_partial_material_continue.py'
      - 'review/fix06/tests/test_revision_overlap_policy.py'
      - 'review/fix06/tests/test_step_compact.py'
      - 'review/fix06/tests/test_20261104_audit_fixes.py'
      - 'review/fix06/ci/patch_alignment_stage2.py'
      - 'review/fix06/tests/test_alignment_stage2_guard.py'
      - 'review/fix06/ci/patch_geometry_registry_streaming.py'
  pull_request:
    paths: ['.github/workflows/rc9-corrected-real-cad.yml', 'DSCompare_RC9_KOMPLET_ZRODLA.zip']
  workflow_dispatch:
concurrency:
  group: dscompare-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      PYTHONFAULTHANDLER: '1'
      QT_QPA_PLATFORM: offscreen
      DSCOMPARE_IMPORT_CACHE: 'off'
      DSCOMPARE_TRACE_BREP: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Extract corrected RC9 sources used by ZIP build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Expand-Archive -LiteralPath DSCompare_RC9_KOMPLET_ZRODLA.zip -DestinationPath . -Force
          python dscompare_rc9_manual/ci/check_source_bundle.py dscompare_rc9_manual
          if ($LASTEXITCODE -ne 0) { throw 'Incomplete or changed source bundle' }
          # The frozen ZIP is a baseline only. Test the same material-recovery
          # source that was compiled and verified on the authentic Swerve pair.
          Copy-Item review/fix06/dsac29/revision_overlap.py dscompare_rc9_manual/dsac29/revision_overlap.py -Force
          Copy-Item review/fix06/dsac29/overlap_evidence.py dscompare_rc9_manual/dsac29/overlap_evidence.py -Force
          Copy-Item review/fix06/dsac29/candidate_policy.py dscompare_rc9_manual/dsac29/candidate_policy.py -Force
          Copy-Item review/fix06/dsac29/worker_v37.py dscompare_rc9_manual/dsac29/worker_v37.py -Force
          Copy-Item review/fix06/dsac29/palette.py dscompare_rc9_manual/dsac29/palette.py -Force
          Copy-Item review/fix06/dsac29/preview3d.py dscompare_rc9_manual/dsac29/preview3d.py -Force
          # Ensure durable crash markers are included in the actual frozen-ZIP build.
          Copy-Item review/fix06/dsac29/progress_events.py dscompare_rc9_manual/dsac29/progress_events.py -Force
          Copy-Item review/fix06/tests/test_progress_durable_phases.py dscompare_rc9_manual/tests/test_progress_durable_phases.py -Force
          foreach ($file in @('test_streamed_preview.py','test_translated_proof_index.py','test_spatial_index_oracle.py','test_spatial_index_2500.py','test_spatial_index_dense.py')) {
            Copy-Item "review/fix06/tests/$file" "dscompare_rc9_manual/tests/$file" -Force
          }
          Copy-Item review/fix06/dsac29/preview_template.html dscompare_rc9_manual/dsac29/preview_template.html -Force
          Copy-Item review/fix06/dsac29/common_exclusion.py dscompare_rc9_manual/dsac29/common_exclusion.py -Force
          python review/fix06/ci/patch_common_exclusion_dispatch.py dscompare_rc9_manual/dsac29/native_guard.py
          python review/fix06/ci/patch_material_worker_failclosed.py dscompare_rc9_manual
          python review/fix06/ci/patch_gui_minimal.py dscompare_rc9_manual
          python review/fix06/ci/patch_legacy_ui_tests.py dscompare_rc9_manual
          # Apply name fixes after overlaying the exact-BRep exporter.
          Copy-Item review/fix06/dsac29/step_io.py dscompare_rc9_manual/dsac29/step_io.py -Force
          Copy-Item review/fix06/dsac29/cli.py dscompare_rc9_manual/dsac29/cli.py -Force
          python review/fix06/ci/patch_geometry_registry_streaming.py dscompare_rc9_manual/dsac29/geometry_registry.py
          if ($LASTEXITCODE -ne 0) { throw 'Streaming registry patch failed' }
          python review/fix06/ci/patch_alignment_stage2.py dscompare_rc9_manual/dsac29/alignment.py
          if ($LASTEXITCODE -ne 0) { throw 'Alignment stage2 guard patch failed' }
          python review/fix06/ci/patch_step_polish_names.py dscompare_rc9_manual
          if ($LASTEXITCODE -ne 0) { throw 'Isolated material fail-closed patch failed' }
          if ($LASTEXITCODE -ne 0) { throw 'Verified Common/Cut dispatch patch failed' }
          Copy-Item review/fix06/tests/test_partial_material_continue.py dscompare_rc9_manual/tests/test_partial_material_continue.py -Force
          Copy-Item review/fix06/tests/test_material_worker_failclosed.py dscompare_rc9_manual/tests/test_material_worker_failclosed.py -Force
          python review/fix06/ci/patch_openarm_auto_partial.py dscompare_rc9_manual/ci/real_openarm_review.py
          if ($LASTEXITCODE -ne 0) { throw 'OpenArm automatic partial audit patch failed' }
          Copy-Item review/fix06/tests/test_overlap_evidence.py dscompare_rc9_manual/tests/test_overlap_evidence.py -Force
          Copy-Item review/fix06/tests/test_candidate_policy.py dscompare_rc9_manual/tests/test_candidate_policy.py -Force
          Copy-Item review/fix06/tests/test_gui_minimal.py dscompare_rc9_manual/tests/test_gui_minimal.py -Force
          Copy-Item review/fix06/tests/test_revision_overlap_policy.py dscompare_rc9_manual/tests/test_revision_overlap_policy.py -Force
          Copy-Item review/fix06/tests/test_semantic_palette_export.py dscompare_rc9_manual/tests/test_semantic_palette_export.py -Force
          Copy-Item review/fix06/tests/test_step_compact.py dscompare_rc9_manual/tests/test_step_compact.py -Force
          Copy-Item review/fix06/tests/test_20261104_audit_fixes.py dscompare_rc9_manual/tests/test_20261104_audit_fixes.py -Force
          Copy-Item review/fix06/tests/test_alignment_stage2_guard.py dscompare_rc9_manual/tests/test_alignment_stage2_guard.py -Force
          python review/fix06/ci/patch_legacy_palette_test.py dscompare_rc9_manual/tests/test_output_palette.py
          if ($LASTEXITCODE -ne 0) { throw 'Neutral Common palette regression patch failed' }
          python review/fix06/ci/patch_legacy_dual_failure_tests.py dscompare_rc9_manual/tests
          if ($LASTEXITCODE -ne 0) { throw 'Frozen dual-failure regression patch failed' }
          python review/fix06/ci/patch_partial_audit.py dscompare_rc9_manual/ci/audit_partial_artifacts.py
          if ($LASTEXITCODE -ne 0) { throw 'Frozen OpenArm partial audit patch failed' }
          python -m compileall -q dscompare_rc9_manual/dsac29/revision_overlap.py dscompare_rc9_manual/dsac29/common_exclusion.py dscompare_rc9_manual/dsac29/native_guard.py
          if ($LASTEXITCODE -ne 0) { throw 'Patched CAD Python syntax failed' }
          Write-Host 'PATCHED_SWERVE_ENGINE_SOURCE_PASS'
          Get-FileHash DSCompare_RC9_KOMPLET_ZRODLA.zip -Algorithm SHA256 | Format-List
          python -m compileall -q dscompare_rc9_manual/dsac29
          if ($LASTEXITCODE -ne 0) { throw 'Syntax validation failed' }
      - name: Upload patched Python sources for deterministic failure analysis
        uses: actions/upload-artifact@v4
        with:
          name: RC9-patched-source-snapshot
          path: |
            dscompare_rc9_manual/SOURCE_MANIFEST.json
            dscompare_rc9_manual/tests/**
            dscompare_rc9_manual/dsac29/*.html
            dscompare_rc9_manual/dsac29/*.py
            dscompare_rc9_manual/ci/*.py
          if-no-files-found: error
          retention-days: 14
      - name: Build corrected RC9 and run available regressions
        shell: pwsh
        working-directory: dscompare_rc9_manual
        run: |
          $ErrorActionPreference = 'Stop'
          ./BUDUJ_WINDOWS.ps1 -InstallOnly
          if ($LASTEXITCODE -ne 0) { throw 'Install failed' }
          python -m pip install pytest
          if ($LASTEXITCODE -ne 0) { throw 'pytest install failed' }
          python ci/run_manual_regressions.py
          if ($LASTEXITCODE -ne 0) { throw 'Corrected source regressions failed' }
          python -m pytest -q tests/test_progress_durable_phases.py tests/test_streamed_preview.py tests/test_translated_proof_index.py tests/test_spatial_index_oracle.py tests/test_spatial_index_2500.py tests/test_spatial_index_dense.py
          if ($LASTEXITCODE -ne 0) { throw 'Durable phase regression failed' }
          python -m pytest -q tests/test_overlap_evidence.py tests/test_candidate_policy.py tests/test_revision_overlap_policy.py tests/test_gui_minimal.py tests/test_semantic_palette_export.py tests/test_step_compact.py tests/test_20261104_audit_fixes.py tests/test_alignment_stage2_guard.py tests/test_material_worker_failclosed.py tests/test_partial_material_review.py tests/test_partial_material_continue.py tests/test_revision_common_recovery.py tests/test_revision_r4.py tests/test_r15_material_renamed.py
          if ($LASTEXITCODE -ne 0) { throw 'Patched material-recovery regressions failed' }
          python ci/test_rc9_original_boundary.py
          if ($LASTEXITCODE -ne 0) { throw 'Original boundary regression failed' }
          ./BUDUJ_WINDOWS.ps1 -NoInstall
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          if (!(Test-Path dist/DSCompare/DSCompare.exe)) { throw 'Missing EXE' }
      - name: Validate packaged Windows EXE and archive roundtrip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = 'dscompare_rc9_manual/dist/DSCompare'
          $exe = Join-Path $dist 'DSCompare.exe'
          if (-not (Test-Path $exe)) { throw 'Missing packaged EXE' }
          $dlls = @(Get-ChildItem -Path $dist -Filter '*.dll' -Recurse -File)
          if ($dlls.Count -eq 0) { throw 'No packaged native DLLs' }
          $ocp = @(Get-ChildItem -Path $dist -Recurse -File | Where-Object { $_.FullName -match '[\\/]OCP[\\/]' -and $_.Extension -eq '.pyd' })
          if ($ocp.Count -eq 0) { throw 'Missing OCP Python extension modules' }
          $zip = Join-Path $env:RUNNER_TEMP 'DSCompare-RC9-verify.zip'
          Compress-Archive -Path "$dist/*" -DestinationPath $zip -CompressionLevel Optimal -Force
          Add-Type -AssemblyName System.IO.Compression
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
            foreach ($entry in $archive.Entries) {
              if ($entry.Length -eq 0 -and $entry.Name -eq '') { continue }
              $stream = $entry.Open()
              try {
                $buffer = New-Object byte[] 1048576
                while ($stream.Read($buffer, 0, $buffer.Length) -gt 0) {}
              } finally { $stream.Dispose() }
            }
          } finally { $archive.Dispose() }
          $unpack = Join-Path $env:RUNNER_TEMP 'DSCompare-RC9-roundtrip'
          Expand-Archive -Path $zip -DestinationPath $unpack -Force
          $original = @(Get-ChildItem -Path $dist -Recurse -File)
          foreach ($file in $original) {
            $relative = $file.FullName.Substring((Resolve-Path $dist).Path.Length).TrimStart('\')
            $copy = Join-Path $unpack $relative
            if (-not (Test-Path $copy)) { throw "Archive missing $relative" }
            if ((Get-FileHash $file.FullName -Algorithm SHA256).Hash -ne (Get-FileHash $copy -Algorithm SHA256).Hash) {
              throw "Archive corrupted $relative"
            }
          }
          Write-Host "PACKAGING_ROUNDTRIP_PASS files=$($original.Count) ocp_extensions=$($ocp.Count)"
      - name: Upload exact tested Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: RC9-large-current-Windows-x64
          path: dscompare_rc9_manual/dist/DSCompare/**
          if-no-files-found: error
  cad:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        include:
          - {model: v2, case: shift}
          - {model: v2, case: revision_shift}
          - {model: trident, case: shift}
          - {model: trident, case: revision_shift}
          - {model: v2, case: revision}
          - {model: trident, case: revision}
          - {model: openarm, case: review}
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      PYTHONFAULTHANDLER: '1'
      QT_QPA_PLATFORM: offscreen
      DSCOMPARE_IMPORT_CACHE: 'off'
      DSCOMPARE_TRACE_BREP: '1'
      DSCOMPARE_SAVE_FAILED_BREP: '1'
      DSCOMPARE_CAPTURE_ACTIVE_BREP: '1'
      DSCOMPARE_DURABLE_PHASES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Extract corrected RC9 sources used by ZIP build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Expand-Archive -LiteralPath DSCompare_RC9_KOMPLET_ZRODLA.zip -DestinationPath . -Force
          python dscompare_rc9_manual/ci/check_source_bundle.py dscompare_rc9_manual
          if ($LASTEXITCODE -ne 0) { throw 'Incomplete or changed source bundle' }
          # The frozen ZIP is a baseline only. Test the same material-recovery
          # source that was compiled and verified on the authentic Swerve pair.
          Copy-Item review/fix06/dsac29/revision_overlap.py dscompare_rc9_manual/dsac29/revision_overlap.py -Force
          Copy-Item review/fix06/dsac29/overlap_evidence.py dscompare_rc9_manual/dsac29/overlap_evidence.py -Force
          Copy-Item review/fix06/dsac29/candidate_policy.py dscompare_rc9_manual/dsac29/candidate_policy.py -Force
          Copy-Item review/fix06/dsac29/worker_v37.py dscompare_rc9_manual/dsac29/worker_v37.py -Force
          Copy-Item review/fix06/dsac29/palette.py dscompare_rc9_manual/dsac29/palette.py -Force
          Copy-Item review/fix06/dsac29/preview3d.py dscompare_rc9_manual/dsac29/preview3d.py -Force
          Copy-Item review/fix06/dsac29/preview_template.html dscompare_rc9_manual/dsac29/preview_template.html -Force
          Copy-Item review/fix06/dsac29/common_exclusion.py dscompare_rc9_manual/dsac29/common_exclusion.py -Force
          python review/fix06/ci/patch_common_exclusion_dispatch.py dscompare_rc9_manual/dsac29/native_guard.py
          python review/fix06/ci/patch_material_worker_failclosed.py dscompare_rc9_manual
          python review/fix06/ci/patch_gui_minimal.py dscompare_rc9_manual
          python review/fix06/ci/patch_legacy_ui_tests.py dscompare_rc9_manual
          # Apply name fixes after overlaying the exact-BRep exporter.
          Copy-Item review/fix06/dsac29/step_io.py dscompare_rc9_manual/dsac29/step_io.py -Force
          Copy-Item review/fix06/dsac29/cli.py dscompare_rc9_manual/dsac29/cli.py -Force
          python review/fix06/ci/patch_geometry_registry_streaming.py dscompare_rc9_manual/dsac29/geometry_registry.py
          if ($LASTEXITCODE -ne 0) { throw 'Streaming registry patch failed' }
          python review/fix06/ci/patch_alignment_stage2.py dscompare_rc9_manual/dsac29/alignment.py
          if ($LASTEXITCODE -ne 0) { throw 'Alignment stage2 guard patch failed' }
          python review/fix06/ci/patch_step_polish_names.py dscompare_rc9_manual
          if ($LASTEXITCODE -ne 0) { throw 'Isolated material fail-closed patch failed' }
          if ($LASTEXITCODE -ne 0) { throw 'Verified Common/Cut dispatch patch failed' }
          Copy-Item review/fix06/tests/test_partial_material_continue.py dscompare_rc9_manual/tests/test_partial_material_continue.py -Force
          Copy-Item review/fix06/tests/test_material_worker_failclosed.py dscompare_rc9_manual/tests/test_material_worker_failclosed.py -Force
          python review/fix06/ci/patch_openarm_auto_partial.py dscompare_rc9_manual/ci/real_openarm_review.py
          if ($LASTEXITCODE -ne 0) { throw 'OpenArm automatic partial audit patch failed' }
          Copy-Item review/fix06/tests/test_overlap_evidence.py dscompare_rc9_manual/tests/test_overlap_evidence.py -Force
          Copy-Item review/fix06/tests/test_candidate_policy.py dscompare_rc9_manual/tests/test_candidate_policy.py -Force
          Copy-Item review/fix06/tests/test_gui_minimal.py dscompare_rc9_manual/tests/test_gui_minimal.py -Force
          Copy-Item review/fix06/tests/test_revision_overlap_policy.py dscompare_rc9_manual/tests/test_revision_overlap_policy.py -Force
          Copy-Item review/fix06/tests/test_semantic_palette_export.py dscompare_rc9_manual/tests/test_semantic_palette_export.py -Force
          Copy-Item review/fix06/tests/test_step_compact.py dscompare_rc9_manual/tests/test_step_compact.py -Force
          Copy-Item review/fix06/tests/test_20261104_audit_fixes.py dscompare_rc9_manual/tests/test_20261104_audit_fixes.py -Force
          Copy-Item review/fix06/tests/test_alignment_stage2_guard.py dscompare_rc9_manual/tests/test_alignment_stage2_guard.py -Force
          python review/fix06/ci/patch_legacy_palette_test.py dscompare_rc9_manual/tests/test_output_palette.py
          if ($LASTEXITCODE -ne 0) { throw 'Neutral Common palette regression patch failed' }
          python review/fix06/ci/patch_legacy_dual_failure_tests.py dscompare_rc9_manual/tests
          if ($LASTEXITCODE -ne 0) { throw 'Frozen dual-failure regression patch failed' }
          python review/fix06/ci/patch_partial_audit.py dscompare_rc9_manual/ci/audit_partial_artifacts.py
          if ($LASTEXITCODE -ne 0) { throw 'Frozen OpenArm partial audit patch failed' }
          python -m compileall -q dscompare_rc9_manual/dsac29/revision_overlap.py dscompare_rc9_manual/dsac29/common_exclusion.py dscompare_rc9_manual/dsac29/native_guard.py
          if ($LASTEXITCODE -ne 0) { throw 'Patched CAD Python syntax failed' }
          Write-Host 'PATCHED_SWERVE_ENGINE_SOURCE_PASS'
          Get-FileHash DSCompare_RC9_KOMPLET_ZRODLA.zip -Algorithm SHA256 | Format-List
          python -m compileall -q dscompare_rc9_manual/dsac29
          if ($LASTEXITCODE -ne 0) { throw 'Syntax validation failed' }
      - uses: actions/download-artifact@v4
        with:
          name: RC9-large-current-Windows-x64
          path: dscompare_rc9_manual/dist/DSCompare
      - name: Install CAD test dependencies
        shell: pwsh
        run: |
          python -m pip install 'cadquery-ocp==7.9.3.1.1' 'numpy>=1.26,<3'
          if ($LASTEXITCODE -ne 0) { throw 'Dependencies failed' }
          New-Item -ItemType Directory -Path diagnostics -Force | Out-Null
          python -m pip freeze | Out-File diagnostics/dependencies.txt
          Get-ComputerInfo | Out-File diagnostics/system.txt
      - name: Run real CAD assembly scenario
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONPATH = (Resolve-Path dscompare_rc9_manual).Path
          $case = '${{ matrix.case }}'
          $model = '${{ matrix.model }}'
          New-Item -ItemType Directory -Path evidence -Force | Out-Null
          # Enable a user-scoped Windows Error Reporting minidump for native AV.
          # A failed registry setup does not weaken the CAD assertions.
          try {
            $dumpPath = Join-Path (Resolve-Path evidence).Path 'crash-dumps'
            New-Item -ItemType Directory -Path $dumpPath -Force | Out-Null
            $werKey = 'HKCU:\Software\Microsoft\Windows\Windows Error Reporting\LocalDumps\DSCompare.exe'
            New-Item -Path $werKey -Force | Out-Null
            New-ItemProperty -Path $werKey -Name DumpFolder -PropertyType ExpandString -Value $dumpPath -Force | Out-Null
            New-ItemProperty -Path $werKey -Name DumpType -PropertyType DWord -Value 1 -Force | Out-Null
            New-ItemProperty -Path $werKey -Name DumpCount -PropertyType DWord -Value 2 -Force | Out-Null
          } catch { Write-Warning "WER crash dump setup unavailable: $_" }
          $ramPath = Join-Path (Resolve-Path evidence).Path 'ram-samples.csv'
          Set-Content -Path $ramPath -Value 'utc,combined_working_set_bytes,max_process_working_set_bytes,process_count'
          $sampler = Start-Job -ArgumentList $ramPath -ScriptBlock {
            param($path)
            while ($true) {
              try {
                $p = @(Get-Process -Name DSCompare -ErrorAction SilentlyContinue)
                if ($p.Count -gt 0) {
                  $sum = ($p | Measure-Object -Property WorkingSet64 -Sum).Sum
                  $max = ($p | Measure-Object -Property WorkingSet64 -Maximum).Maximum
                  $stamp = [DateTime]::UtcNow.ToString('o')
                  Add-Content -Path $path -Value "$stamp,$sum,$max,$($p.Count)"
                }
              } catch {}
              Start-Sleep -Seconds 2
            }
          }
          try {
            if ($case -eq 'revision_repeat') {
              # Reproduce first-pass success followed by failure on the SAME
              # runner, same EXE and same workspace, without clearing caches.
              # Each invocation is a fresh process; in-process UI reuse is
              # a separate regression scenario.
              $results = @()
              foreach ($iteration in 1..2) {
                Write-Host "REPEAT_BEGIN iteration=$iteration commit=$env:GITHUB_SHA"
                python dscompare_rc9_manual/ci/real_revision_without_shift.py dscompare_rc9_manual/dist/DSCompare/DSCompare.exe $model
                $rc = $LASTEXITCODE
                $results += $rc
                $iterationDir = "evidence/repeat-$iteration"
                New-Item -ItemType Directory -Path $iterationDir -Force | Out-Null
                foreach ($log in @('EXE_STDOUT.log','EXE_STDERR.log')) {
                  $logPath = "dscompare_rc9_manual/ci/$log"
                  if (Test-Path $logPath) { Copy-Item $logPath "$iterationDir/$log" -Force }
                }
                Get-ChildItem -Path 'dscompare_rc9_manual/ci' -Filter '*.json' -ErrorAction SilentlyContinue |
                  Copy-Item -Destination $iterationDir -Force -ErrorAction SilentlyContinue
                Write-Host "REPEAT_END iteration=$iteration exit_code=$rc"
              }
              $results | ConvertTo-Json | Set-Content evidence/repeat-exit-codes.json
              if ($results[0] -ne $results[1]) {
                Write-Host "::error::NONDETERMINISTIC repeat results: $($results -join ',')"
              }
              if (($results | Where-Object { $_ -ne 0 }).Count -gt 0) { $global:LASTEXITCODE = 1 }
              else { $global:LASTEXITCODE = 0 }
            } elseif ($case -eq 'review') {
              python dscompare_rc9_manual/ci/real_openarm_review.py dscompare_rc9_manual/dist/DSCompare/DSCompare.exe
            } elseif ($case -eq 'revision') {
              python dscompare_rc9_manual/ci/real_revision_without_shift.py dscompare_rc9_manual/dist/DSCompare/DSCompare.exe $model
            } else {
              python dscompare_rc9_manual/ci/large_exe.py dscompare_rc9_manual/dist/DSCompare/DSCompare.exe $model $case
            }
            $exitCode = $LASTEXITCODE
          } finally {
            Stop-Job $sampler -ErrorAction SilentlyContinue
            Remove-Job $sampler -Force -ErrorAction SilentlyContinue
            try {
              $faultRoot = Join-Path $env:LOCALAPPDATA 'DSCompare\logs'
              if (Test-Path $faultRoot) {
                New-Item -ItemType Directory -Path evidence/faultlogs -Force | Out-Null
                Copy-Item -Path (Join-Path $faultRoot '*') -Destination evidence/faultlogs -Force -ErrorAction SilentlyContinue
              }
            } catch { Write-Warning "Could not collect faulthandler logs: $_" }
          }
          $samples = @(Import-Csv $ramPath)
          if ($samples.Count -gt 0) {
            $peak = ($samples | Measure-Object -Property combined_working_set_bytes -Maximum).Maximum
            Write-Host "SAMPLED_COMBINED_PEAK_WORKING_SET_BYTES=$peak"
          }
          if ($exitCode -ne 0) { throw "Real CAD $model $case failed" }
      - name: Probe failed Common independently (diagnostic only)
        if: failure()
        shell: pwsh
        run: |
          # Captured A/B are the exact failed inputs; probes are never a CAD verdict.
          # Timeouts and invalid OCCT outputs remain explicit in the JSON artifact.
          python dscompare_rc9_manual/ci/rc9_common_probe.py evidence/comparison/FAILED_BREP/common evidence/common-probe.json 12
          if ($LASTEXITCODE -ne 0) { Write-Warning 'Common probe failed; original CAD failure remains authoritative' }
      - name: Summarize failure location and persisted diagnostics
        if: failure()
        shell: pwsh
        run: |
          python dscompare_rc9_manual/ci/rc9_failure_summary.py evidence '${{ matrix.model }}' '${{ matrix.case }}'
          if ($LASTEXITCODE -ne 0) { Write-Warning 'Diagnostic summary failed; preserve original CAD failure' }
      - name: Audit STEP HTML and BOM artifacts
        if: matrix.case != 'revision_repeat'
        shell: pwsh
        run: |
          if ('${{ matrix.case }}' -eq 'review') {
            python dscompare_rc9_manual/ci/audit_partial_artifacts.py evidence
          } else {
            python dscompare_rc9_manual/ci/audit_artifacts.py evidence '${{ matrix.case }}'
          }
          if ($LASTEXITCODE -ne 0) { throw 'Output artifact audit failed' }
      - name: Save evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RC9-large-${{ matrix.model }}-${{ matrix.case }}
          path: |
            evidence/**
            diagnostics/**
            dscompare_rc9_manual/ci/EXE_STDOUT.log
            dscompare_rc9_manual/ci/EXE_STDERR.log
            dscompare_rc9_manual/ci/evidence/**
            dscompare_rc9_manual/ci/models/**/comparison/**
          if-no-files-found: warn
          retention-days: 14

  desktop:
    name: Svelte 5 Tauri 2 Windows installer
    needs: build
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Extract verified complete source bundle
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath DSCompare_RC9_KOMPLET_ZRODLA.zip -DestinationPath . -Force
          python dscompare_rc9_manual/ci/check_source_bundle.py dscompare_rc9_manual
          if ($LASTEXITCODE -ne 0) { throw 'Source bundle mismatch' }
      - uses: actions/download-artifact@v4
        with:
          name: RC9-large-current-Windows-x64
          path: dscompare_rc9_manual/desktop/src-tauri/engine/DSCompare
      - name: Check frontend and process boundary then build complete installer
        shell: pwsh
        working-directory: dscompare_rc9_manual/desktop
        run: |
          $ErrorActionPreference = 'Stop'
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
          npm run check
          if ($LASTEXITCODE -ne 0) { throw 'Svelte check failed' }
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Frontend tests failed' }
          cargo test --manifest-path src-tauri/Cargo.toml --lib --locked
          if ($LASTEXITCODE -ne 0) { throw 'Rust process tests failed' }
          npm run tauri build
          if ($LASTEXITCODE -ne 0) { throw 'Tauri installer build failed' }
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: DSCompare-Svelte5-Tauri2-Windows-installer
          path: dscompare_rc9_manual/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
