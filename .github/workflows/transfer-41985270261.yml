name: DSCompare 41985270261 ZIP to SwissTransfer
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/transfer-41985270261.yml'
permissions:
  contents: read
  actions: read
jobs:
  transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      XDG_CONFIG_HOME: /tmp/swissfer-config
    steps:
      - name: Build transfer client
        run: |
          set -euo pipefail
          git clone -q https://github.com/Blutsh/swissfer.git swissfer
          git -C swissfer checkout --quiet --detach 87fd6771421dda43cc27c695e14a067429043c17
          cargo build --release --locked --manifest-path swissfer/Cargo.toml
      - name: Restore previously confirmed sender
        run: |
          set -euo pipefail
          mkdir -p pending "$XDG_CONFIG_HOME/swissfer"
          gh run download 41838393837 --repo "$GITHUB_REPOSITORY" --name swissfer-validation-state --dir pending
          cp pending/email-validations.json "$XDG_CONFIG_HOME/swissfer/email-validations.json"
      - name: Download exact build and package single EXE
        run: |
          set -euo pipefail
          mkdir -p payload outgoing
          gh run download 41985270261 --repo "$GITHUB_REPOSITORY" --name DSCompare-0.6.0-Portable-OneEXE --dir payload
          test -s payload/DSCompare.exe
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_STORED
          exe=Path('payload/DSCompare.exe')
          assert exe.stat().st_size > 100_000_000
          target=Path('outgoing/DSCompare-OneEXE-41985270261.zip')
          with ZipFile(target,'w',compression=ZIP_STORED) as z:
              z.write(exe,arcname='DSCompare.exe')
          with ZipFile(target) as z:
              assert z.namelist()==['DSCompare.exe']
          print('ZIP bytes:',target.stat().st_size)
          PY
      - name: Upload ZIP
        timeout-minutes: 18
        run: |
          set -euo pipefail
          timeout 900s swissfer/target/release/swissfer outgoing/DSCompare-OneEXE-41985270261.zip \
            --email damianink@gmail.com --duration 30 \
            --message 'DSCompare single EXE ZIP from 41985270261' </dev/null > upload.log 2>&1
          cat upload.log
          url=$(grep -Eo 'https://(www\.)?swisstransfer\.com/dl/[a-zA-Z0-9-]+' upload.log | tail -n 1 || true)
          test -n "$url"
          echo "SwissTransfer: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Save diagnostic information
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transfer-41985270261-log
          path: upload.log
          if-no-files-found: warn
          retention-days: 3
