name: Diagnose strict RC9 CAD failures
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/diagnose-rc9-failures.yml']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Inspect actual failed CAD artifacts without extracting large STEP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os,subprocess,pathlib,json
          # Exact latest failing Windows scenarios from run 40716826311.
          # This diagnostic never changes CAD classification or acceptance.
          ids={
            'trident_revision':12829659510,
            'trident_shift':12830273772,
            'trident_revision_shift':12831143119,
          }
          for label,art in ids.items():
            print('\n===== ARTIFACT',label,art,'=====',flush=True)
            
            subprocess.run(['gh','api',f'repos/damianink-png/test/actions/artifacts/{art}/zip'],check=True,stdout=open('artifact.zip','wb'))
            with __import__('zipfile').ZipFile('artifact.zip') as z:
              for n in z.namelist():
                inf=z.getinfo(n)
                print('ENTRY',n,inf.file_size)
                if inf.file_size>8_000_000 or not n.lower().endswith(('.txt','.json','.log','.stderr','.stdout','.csv','.xml')):continue
                data=z.read(n).decode('utf-8','replace')
                if n.lower().endswith('.json'):
                  try:
                    obj=json.loads(data)
                    if isinstance(obj,dict):
                      for key in ('error','exception','traceback','status','seconds','returncode','alignment','summary','reason','ram_peak_mb','peak_rss_mb'):
                        if key in obj:print('FIELD',key,str(obj[key])[:1600])
                  except Exception:pass
                lines=data.splitlines()
                hits=[x for x in lines if any(k in x.lower() for k in ('error','exception','traceback','timeout','fatal','failed','brep','incomplete','alignment','memory','peak','limit','aborted','exit','terminated','same','common','stage'))]
                for line in hits[-110:]:print('LOG',line[:900])
                if not hits:
                  for line in lines[-18:]:print('TAIL',line[:700])
                if n.lower().endswith(('exe_stderr.log','exe_stdout.log')):
                  for line in lines[-60:]:print('EXE_TAIL',line[:900])
          PY

      - name: Export exact RC9 source modules for diagnosis
        shell: bash
        run: |
          python - <<'PY'
          import zipfile,pathlib
          src=pathlib.Path('DSCompare_RC9_AUDYT_20261028_ZRODLA.zip')
          out=pathlib.Path('diagnostic-source')
          out.mkdir(exist_ok=True)
          wanted={'native_guard.py','material_deltas.py','deferred_alignment.py','brep_safety.py','compare.py','revision_overlap.py','trace_r22.py'}
          with zipfile.ZipFile(src) as z:
            for n in z.namelist():
              if pathlib.PurePosixPath(n).name in wanted and '/dsac29/' in '/'+n:
                dest=out/pathlib.PurePosixPath(n).name
                dest.write_bytes(z.read(n))
                print('EXPORTED',n,'->',dest)
          assert (out/'native_guard.py').exists()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rc9-source-modules-for-debug
          path: diagnostic-source/**
          if-no-files-found: error
