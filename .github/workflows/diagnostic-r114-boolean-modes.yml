name: DS Compare R11.4 OLSK OCCT Boolean modes
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diagnostic-r114-boolean-modes.yml'
      - 'diagnostics/olsk_boolean_modes.py'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-2022
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
      - name: Extract baseline
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath DSCompare_V4_6_R113_ZRODLA.zip -DestinationPath "$env:RUNNER_TEMP/r114" -Force
      - name: Install geometry engine
        shell: pwsh
        run: |
          python -m pip install -r "$env:RUNNER_TEMP/r114/v46/requirements.txt"
          if($LASTEXITCODE -ne 0){throw 'Dependencies failed'}
      - name: Benchmark BRepAlgoAPI Common options for failed geometry pair
        shell: pwsh
        timeout-minutes: 12
        run: |
          python -u diagnostics/olsk_boolean_modes.py "$env:RUNNER_TEMP/r114/v46" 2>&1 | Tee-Object OLSK_COMMON_MODES.txt
          if($LASTEXITCODE -ne 0){throw 'Diagnostic failed'}
      - name: Upload shape diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R114-OLSK-COMMON-MODES
          path: OLSK_SHAPE_DIAG.txt
          retention-days: 30
