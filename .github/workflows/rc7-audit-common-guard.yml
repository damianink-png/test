name: DS Compare RC7 audit - native Common isolation and six CAD scenarios
on:
  push:
    branches: [audit/dscompare-rc7-native-common-guard-20261025]
    paths:
      - scripts/rc7_common_guard_patch.py
      - tests/test_rc7_common_guard.py
      - .github/workflows/rc7-audit-common-guard.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      PYTHONFAULTHANDLER: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m zipfile -e DSCompare_RC7_SOURCES.zip src
      - name: Apply minimal safe native Common containment patch
        shell: pwsh
        run: |
          python scripts/rc7_common_guard_patch.py src
          if ($LASTEXITCODE -ne 0) { throw 'Patch failed' }
          Copy-Item tests/test_rc7_common_guard.py src/tests/test_rc7_common_guard.py
      - name: Dependencies, 209+ regressions, native guard tests and Windows EXE
        working-directory: src
        shell: pwsh
        run: |
          ./BUDUJ_WINDOWS.ps1 -InstallOnly
          if ($LASTEXITCODE -ne 0) { throw 'Install failed' }
          python -m pip install pytest
          python -m pytest -q tests/test_rc7_common_guard.py
          if ($LASTEXITCODE -ne 0) { throw 'Guard tests failed' }
          python TESTUJ.py
          if ($LASTEXITCODE -ne 0) { throw 'Regression failed' }
          ./BUDUJ_WINDOWS.ps1 -NoInstall
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          $p=Start-Process ./dist/DSCompare/DSCompare.exe -ArgumentList '--smoke-test-ui','UI_CHECK' -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path UI_CHECK/UI_OK.json)) { throw 'UI failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: DSCompare-RC7-AUDIT-Windows-x64
          path: src/dist/DSCompare/**
          if-no-files-found: error
  cad:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 70
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        model: [v2, trident]
        case: [shift, revision_shift, revision]
    env:
      PYTHONUTF8: '1'
      PYTHONFAULTHANDLER: '1'
      QT_QPA_PLATFORM: offscreen
      DSCOMPARE_IMPORT_CACHE: 'off'
      DSCOMPARE_TRACE_BREP: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: DSCompare-RC7-AUDIT-Windows-x64
          path: app
      - name: Load matching CAD harness
        shell: pwsh
        run: |
          python -m zipfile -e DSCompare_RC7_SOURCES.zip src
          python -m pip install 'cadquery-ocp==7.9.3.1.1' 'numpy>=1.26,<3'
      - name: Test actual compiled Windows EXE
        shell: pwsh
        run: |
          $env:PYTHONPATH=(Resolve-Path src).Path
          if ('${{ matrix.case }}' -eq 'revision') {
            python src/ci/real_revision_without_shift.py app/DSCompare.exe ${{ matrix.model }}
          } else {
            python src/ci/large_exe.py app/DSCompare.exe ${{ matrix.model }} ${{ matrix.case }}
          }
          if ($LASTEXITCODE -ne 0) { throw 'CAD test failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RC7-AUDIT-${{ matrix.model }}-${{ matrix.case }}
          path: evidence/**
          if-no-files-found: warn
          retention-days: 14
