name: DS Compare RC9 - integrated Windows build and real CAD
on:
  push:
    branches: [codex/rc9-palette-20261102]
    paths:
      - 'review/fix06/apply_rc9_20261102.py'
      - 'review/fix06/dsac29/revision_overlap.py'
      - 'review/fix06/tests/test_rc9_retry_after_assembly_failure.py'
      - '.github/workflows/dscompare-rc9-integrated-20261102.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: rc9-integrated-20261102
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 100
    env:
      PYTHONUTF8: '1'
      PYTHONFAULTHANDLER: '1'
      QT_QPA_PLATFORM: offscreen
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch original build root and latest pinned source snapshot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch origin main --depth=1
          git checkout origin/main -- DSCompare_RC9_AUDYT_20261028_ZRODLA.zip
          Expand-Archive -LiteralPath DSCompare_RC9_AUDYT_20261028_ZRODLA.zip -DestinationPath baseline -Force
          gh run download 41419934404 --repo "$env:GITHUB_REPOSITORY" --name RC9-patched-source-snapshot --dir snapshot
          if (!(Test-Path snapshot/dsac29/revision_overlap.py)) { throw 'Source snapshot missing revision_overlap.py' }
          if (!(Test-Path baseline/dscompare_rc9_manual/BUDUJ_WINDOWS.ps1)) { throw 'Build root missing BUDUJ_WINDOWS.ps1' }
          foreach ($folder in @('dsac29','ci','tests')) {
            New-Item -ItemType Directory -Force "baseline/dscompare_rc9_manual/$folder" | Out-Null
            Copy-Item "snapshot/$folder/*" "baseline/dscompare_rc9_manual/$folder/" -Recurse -Force
          }
          Copy-Item review/fix06/tests/test_rc9_retry_after_assembly_failure.py baseline/dscompare_rc9_manual/tests/ -Force
          python review/fix06/apply_rc9_20261102.py baseline/dscompare_rc9_manual
          foreach ($module in @('revision_overlap.py','candidate_policy.py','overlap_evidence.py')) {
            Copy-Item "review/fix06/dsac29/$module" "baseline/dscompare_rc9_manual/dsac29/$module" -Force
          }
          if ($LASTEXITCODE -ne 0) { throw 'Source patch failed' }
      - name: Build real Windows executable from patched sources
        shell: pwsh
        working-directory: baseline/dscompare_rc9_manual
        run: |
          $ErrorActionPreference = 'Stop'
          ./BUDUJ_WINDOWS.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Build script failed' }
          if (!(Test-Path dist/DSCompare/DSCompare.exe)) { throw 'DSCompare.exe missing' }
      - name: Run strict geometry and output regressions
        shell: pwsh
        working-directory: baseline/dscompare_rc9_manual
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install pytest cadquery-ocp numpy
          # Run native OCCT tests in fresh Python processes; combined pytest
          # can retain worker state and stall unrelated subsequent tests.
          foreach ($test in @('test_revision_overlap_policy.py','test_revision_common_recovery.py','test_rc9_retry_after_assembly_failure.py','test_output_palette.py','test_stability.py')) {
            python -m pytest -q "tests/$test"
            if ($LASTEXITCODE -ne 0) { throw "Regression failed: $test" }
          }
      - name: Upload tested executable and source
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RC9-20261102-integrated-Windows-and-evidence
          path: |
            baseline/dscompare_rc9_manual/dist/DSCompare/**
            baseline/dscompare_rc9_manual/unit-results.xml
            baseline/dscompare_rc9_manual/dsac29/revision_overlap.py
            baseline/dscompare_rc9_manual/dsac29/gui45.py
            baseline/dscompare_rc9_manual/dsac29/gui46.py
          if-no-files-found: warn
          retention-days: 30
  real-cad:
    needs: build
    if: ${{ needs.build.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: v2
            case: shift
          - model: v2
            case: revision_shift
          - model: trident
            case: shift
          - model: trident
            case: revision_shift
          - model: openarm
            case: review
          - model: swerve
            case: revision
    runs-on: windows-2022
    timeout-minutes: 75
    env:
      PYTHONUTF8: '1'
      PYTHONFAULTHANDLER: '1'
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: ${{ github.workspace }}
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: RC9-20261102-integrated-Windows-and-evidence
          path: build-artifact
      - name: Download matching test scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          gh run download 41419934404 --repo "$env:GITHUB_REPOSITORY" --name RC9-patched-source-snapshot --dir snapshot
          if ($LASTEXITCODE -ne 0) { throw 'Pinned source snapshot download failed' }
          if (!(Test-Path snapshot/dsac29/step_io.py)) { throw 'Missing patched STEP importer in pinned snapshot' }
          Copy-Item snapshot/dsac29 -Destination dsac29 -Recurse -Force
          Copy-Item snapshot/ci -Destination ci -Recurse -Force
          # Keep the test scripts in this commit, rather than assuming the older
          # artifact contains scripts that were introduced in later revisions.
          Copy-Item review/fix06/ci/large_exe.py ci/large_exe.py -Force
          Copy-Item review/fix06/ci/fixture_oracles.py ci/fixture_oracles.py -Force
          Copy-Item review/fix06/ci/real_swerve.py ci/real_swerve.py -Force
          if ('${{ matrix.model }}' -eq 'openarm') {
            # The full frozen source bundle includes the original OpenArm test.
            # Preserve its real geometry assertions; only update the obsolete
            # approval-dialog assertion to require noninteractive reporting.
            Expand-Archive -LiteralPath DSCompare_RC9_KOMPLET_ZRODLA.zip -DestinationPath legacy -Force
            $openarm = 'legacy/dscompare_rc9_manual/ci/real_openarm_review.py'
            if (!(Test-Path $openarm)) { throw 'Missing original OpenArm audit in complete source ZIP' }
            Copy-Item $openarm ci/real_openarm_review.py -Force
            $test = Get-Content ci/real_openarm_review.py -Raw
            if ($test.Contains('Review was not explicitly approved')) {
              python review/fix06/ci/patch_openarm_auto_partial.py ci/real_openarm_review.py
              if ($LASTEXITCODE -ne 0) { throw 'OpenArm audit patch failed' }
            } elseif (!$test.Contains('Partial report unexpectedly requested')) {
              throw 'OpenArm audit assertion changed unexpectedly'
            }
          }
          $required = if ('${{ matrix.model }}' -eq 'openarm') { 'ci/real_openarm_review.py' } elseif ('${{ matrix.model }}' -eq 'swerve') { 'ci/real_swerve.py' } else { 'ci/large_exe.py' }
          if (!(Test-Path $required)) { throw "Missing required CAD test script: $required" }
          python -m py_compile $required ci/fixture_oracles.py
          if ($LASTEXITCODE -ne 0) { throw 'CAD test script syntax failed' }
          python -m pip install cadquery-ocp numpy
          if ($LASTEXITCODE -ne 0) { throw 'CAD test dependencies failed' }
      - name: Run actual frozen EXE against public STEP assembly
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'build-artifact/dist/DSCompare/DSCompare.exe').Path
          if ('${{ matrix.model }}' -eq 'swerve') {
            git lfs version
            if ($LASTEXITCODE -ne 0) { throw 'git-lfs missing on runner' }
            git clone --depth 1 https://github.com/AloeVeraZ/diffy-swerve.git swerve-source
            if ($LASTEXITCODE -ne 0) { throw 'Simple Swerve source clone failed' }
            git -C swerve-source lfs pull --include='cad/releases/simple-swerve-v1.zip,cad/releases/simple-swerve-v2-gobilda.zip' --exclude=''
            if ($LASTEXITCODE -ne 0) { throw 'Simple Swerve LFS download failed' }
            $env:SWERVE_RELEASE_DIR = (Resolve-Path 'swerve-source/cad/releases').Path
          }
          if ('${{ matrix.model }}' -eq 'openarm') {
            python ci/real_openarm_review.py "$exe"
          } elseif ('${{ matrix.model }}' -eq 'swerve') {
            python ci/real_swerve.py "$exe"
          } else {
            python ci/large_exe.py "$exe" '${{ matrix.model }}' '${{ matrix.case }}'
          }
          if ($LASTEXITCODE -ne 0) { throw 'Real CAD test failed' }
      - name: Upload real CAD results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RC9-integrated-${{ matrix.model }}-${{ matrix.case }}
          path: evidence/**
          if-no-files-found: warn
          retention-days: 14
