name: DS Compare V3.3 - Windows EXE icon and ZW3D bridge

on:
  workflow_dispatch:
  push:
    paths:
      - 'DSCompare_V3_3_ZRODLA.zip'
      - '.github/workflows/build-dscompare-v33.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 70
    steps:
      - name: Checkout source archive
        uses: actions/checkout@v4

      - name: Setup Python 3.11 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64

      - name: Unpack V3.3 complete sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:GITHUB_WORKSPACE 'DSCompare_V3_3_ZRODLA.zip'
          if (-not (Test-Path -LiteralPath $zip)) { throw "Missing source archive: $zip" }
          $src = Join-Path $env:RUNNER_TEMP 'DSCompare-V33-src'
          New-Item -ItemType Directory -Path $src -Force | Out-Null
          Expand-Archive -LiteralPath $zip -DestinationPath $src -Force
          foreach ($file in @('DSCompareV3.py', 'dsac29/gui.py', 'dsac29/compare.py', 'dsac29/report.py', 'assets/DSCompare.ico', 'assets/DSCompare.png', 'bridge/build_bridge_wrapper.cmd')) {
            if (-not (Test-Path -LiteralPath (Join-Path $src $file))) { throw "Missing archive entry: $file" }
          }
          "DS_COMPARE_SOURCE=$src" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DS_COMPARE_OUT=$src/dist/DSCompareV3" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Unpacked source: $src"

      - name: Install Open CASCADE, tests and packager
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw 'pip upgrade failed' }
          python -m pip install -r (Join-Path $env:DS_COMPARE_SOURCE 'requirements.txt') 'pytest>=8,<10' 'pyinstaller>=6.11,<7'
          if ($LASTEXITCODE -ne 0) { throw 'dependencies installation failed' }

      - name: Execute 19 B-Rep and UI color tests
        shell: pwsh
        run: |
          Set-Location -LiteralPath $env:DS_COMPARE_SOURCE
          python -m py_compile DSCompareV3.py dsac29/gui.py dsac29/step_io.py dsac29/report.py
          if ($LASTEXITCODE -ne 0) { throw 'Python syntax failed' }
          python -m pytest -q tests
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }

      - name: Build Windows executable with taskbar and Start icon
        shell: pwsh
        run: |
          Set-Location -LiteralPath $env:DS_COMPARE_SOURCE
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name DSCompareV3 --collect-all OCP --icon "assets/DSCompare.ico" --add-data "assets/DSCompare.ico;assets" --add-data "assets/DSCompare.png;assets" DSCompareV3.py
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller failed' }
          if (-not (Test-Path (Join-Path $env:DS_COMPARE_OUT 'DSCompareV3.exe'))) { throw 'EXE missing' }

      - name: Build experimental ZW3D 2019 bridge DLL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $where = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $where -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC not found' }
          $env:DS_COMPARE_VCVARS = Join-Path $vs 'VC/Auxiliary/Build/vcvars64.bat'
          if (-not (Test-Path $env:DS_COMPARE_VCVARS)) { throw 'vcvars64 missing' }
          & cmd.exe /d /c (Join-Path $env:DS_COMPARE_SOURCE 'bridge/build_bridge_wrapper.cmd')
          if ($LASTEXITCODE -ne 0) { throw "MSVC bridge build failed: $LASTEXITCODE" }
          if (-not (Test-Path (Join-Path $env:DS_COMPARE_OUT 'DSAssemblyCompare2019.dll'))) { throw 'Bridge DLL missing' }

      - name: Add instructions and Start menu shortcut installer
        shell: pwsh
        run: |
          $dest = $env:DS_COMPARE_OUT
          foreach ($file in @('README_V33.txt','UTWORZ_SKROT_START.ps1','UTWORZ_SKROT_START.cmd')) {
            Copy-Item -LiteralPath (Join-Path $env:DS_COMPARE_SOURCE $file) -Destination (Join-Path $dest $file)
          }
          Copy-Item -LiteralPath (Join-Path $env:DS_COMPARE_SOURCE 'samples') -Destination (Join-Path $dest 'samples') -Recurse
          Copy-Item -LiteralPath (Join-Path $env:DS_COMPARE_SOURCE 'bridge/README_ZW3D.txt') -Destination (Join-Path $dest 'README_ZW3D.txt')
          foreach ($file in @('DSCompareV3.exe','DSAssemblyCompare2019.dll')) {
            $sha = (Get-FileHash -LiteralPath (Join-Path $dest $file) -Algorithm SHA256).Hash
            "$file SHA256 $sha" | Add-Content (Join-Path $dest 'SHA256.txt') -Encoding UTF8
          }
          'BUILD_OK_V3.3_ICON_COLOR_WINDOWS_x64_ZW3D_UNTESTED' | Set-Content (Join-Path $dest 'STATUS.txt') -Encoding UTF8

      - name: Upload portable EXE and DLL
        uses: actions/upload-artifact@v4
        with:
          name: DSCompare-V3.3-Windows-x64-EXE-DLL-ICON
          path: ${{ env.DS_COMPARE_OUT }}/
          if-no-files-found: error
          retention-days: 30