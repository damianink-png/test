name: DS Compare V3.7 - Qt + embedded VTK 3D + STEP BRep
on:
  workflow_dispatch:
  push:
    paths:
      - 'DSCompare_V3_7_ZRODLA.zip'
      - '.github/workflows/build-dscompare-v37.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
      - name: Unpack source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $zip=Join-Path $env:GITHUB_WORKSPACE 'DSCompare_V3_7_ZRODLA.zip'
          if(-not (Test-Path $zip)){throw 'Missing V3.7 sources ZIP'}
          $src=Join-Path $env:RUNNER_TEMP 'DSCompare_v37'
          Expand-Archive -LiteralPath $zip -DestinationPath $src -Force
          foreach($f in @('DSCompareV3.py','dsac29/gui_qt37.py','dsac29/mesh_v37.py','dsac29/worker_v37.py','assets/DSCompare.ico','bridge/build_bridge_wrapper.cmd')){
             if(-not (Test-Path (Join-Path $src $f))){throw "Missing $f"}
          }
          "DS_COMPARE_SOURCE=$src" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "DS_COMPARE_OUT=$src/dist/DSCompareV3" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Dependencies - Open CASCADE + PySide6 + VTK
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if($LASTEXITCODE -ne 0){throw 'pip update failed'}
          python -m pip install -r (Join-Path $env:DS_COMPARE_SOURCE 'requirements.txt') 'PySide6>=6.8,<6.10' 'vtk>=9.3,<9.6' 'pytest>=8,<10' 'pyinstaller>=6.11,<7'
          if($LASTEXITCODE -ne 0){throw 'Dependency installation failed'}
      - name: Test business logic and Qt/VTK imports
        shell: pwsh
        run: |
          Set-Location $env:DS_COMPARE_SOURCE
          python -m pytest -q tests
          if($LASTEXITCODE -ne 0){throw 'Tests failed'}
          $env:QT_API='pyside6'
          python -c "from PySide6 import QtWidgets; from vtkmodules.qt.QVTKRenderWindowInteractor import QVTKRenderWindowInteractor; import dsac29.gui_qt37; print('Qt and VTK imported')"
          if($LASTEXITCODE -ne 0){throw 'Qt/VTK imports failed'}
      - name: Compile single-install portable Windows EXE
        shell: pwsh
        run: |
          Set-Location $env:DS_COMPARE_SOURCE
          $env:QT_API='pyside6'
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name DSCompareV3 --icon assets/DSCompare.ico --collect-all OCP --collect-all vtkmodules --hidden-import vtkmodules.qt.QVTKRenderWindowInteractor --hidden-import vtkmodules.vtkRenderingOpenGL2 --hidden-import vtkmodules.vtkInteractionStyle --add-data "assets/DSCompare.ico;assets" --add-data "assets/DSCompare.png;assets" DSCompareV3.py
          if($LASTEXITCODE -ne 0){throw 'PyInstaller failed'}
          if(-not (Test-Path (Join-Path $env:DS_COMPARE_OUT 'DSCompareV3.exe'))){throw 'Missing EXE'}
      - name: Compile experimental ZW3D x64 bridge DLL
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $where=Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs=& $where -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if(-not $vs){throw 'MSVC not found'}
          $env:DS_COMPARE_VCVARS=Join-Path $vs 'VC/Auxiliary/Build/vcvars64.bat'
          & cmd.exe /d /c (Join-Path $env:DS_COMPARE_SOURCE 'bridge/build_bridge_wrapper.cmd')
          if($LASTEXITCODE -ne 0){throw 'DLL failed'}
          if(-not (Test-Path (Join-Path $env:DS_COMPARE_OUT 'DSAssemblyCompare2019.dll'))){throw 'DLL missing'}
      - name: Copy instructions and attach checksum
        shell: pwsh
        run: |
          $dest=$env:DS_COMPARE_OUT
          Copy-Item (Join-Path $env:DS_COMPARE_SOURCE 'README_V37.txt') (Join-Path $dest 'README_V37.txt')
          Copy-Item (Join-Path $env:DS_COMPARE_SOURCE 'UTWORZ_SKROT_START.cmd') (Join-Path $dest 'UTWORZ_SKROT_START.cmd')
          Copy-Item (Join-Path $env:DS_COMPARE_SOURCE 'UTWORZ_SKROT_START.ps1') (Join-Path $dest 'UTWORZ_SKROT_START.ps1')
          Copy-Item (Join-Path $env:DS_COMPARE_SOURCE 'samples') (Join-Path $dest 'samples') -Recurse
          foreach($name in @('DSCompareV3.exe','DSAssemblyCompare2019.dll')){
            $sha=(Get-FileHash (Join-Path $dest $name) -Algorithm SHA256).Hash
            "$name $sha" | Add-Content (Join-Path $dest 'SHA256.txt')
          }
          'BUILD_OK_V3.7_QT_VTK_WINDOWS_x64_ZW3D_UNTESTED' | Set-Content (Join-Path $dest 'STATUS.txt')
      - name: Upload compiled portable program
        uses: actions/upload-artifact@v4
        with:
          name: DSCompare-V3.7-Windows-x64-Qt-VTK-EXE-DLL
          path: ${{ env.DS_COMPARE_OUT }}/
          if-no-files-found: error
          retention-days: 30