name: RC9 invalid STEP B-Rep repair proof experiment
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/rc9-shapefix-proof-experiment.yml']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'cadquery-ocp==7.9.3.1.1' 'numpy>=1.26,<3'
      - name: Download pinned RC9 and failed real B-Reps
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/damianink-png/test/actions/artifacts/12650346634/zip > /tmp/src.zip
          mkdir -p /tmp/src rc9
          unzip -q /tmp/src.zip -d /tmp/src
          unzip -q /tmp/src/DSCompare_RC9_STABILITY_SOURCES.zip -d rc9
          gh api repos/damianink-png/test/actions/artifacts/12699485972/zip > /tmp/neg.zip
      - name: Check validity and strict proof after conservative shape fix
        env:
          PYTHONPATH: rc9/src
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'PY'
          import zipfile,tempfile,pathlib
          from OCP.TopoDS import TopoDS_Shape
          from OCP.BRep import BRep_Builder
          from OCP.BRepTools import BRepTools
          from OCP.ShapeFix import ShapeFix_Shape
          from dsac29.geometry import describe
          from dsac29.step_reexport_tolerance import shape_valid,reexport_equivalent_world
          def read(p):
              s=TopoDS_Shape();assert BRepTools.Read_s(s,str(p),BRep_Builder());return s
          def fix(s):
              sf=ShapeFix_Shape(s)
              sf.SetPrecision(1.e-7)
              sf.Perform()
              return sf.Shape()
          with zipfile.ZipFile('/tmp/neg.zip') as z:
              with tempfile.TemporaryDirectory() as tmp:
                  for n in (3,4,5,6,10):
                      prefix=f'evidence/comparison/FAILED_BREP/world_negative_{n:02d}'
                      a=pathlib.Path(tmp)/'A.brep';b=pathlib.Path(tmp)/'B.brep'
                      a.write_bytes(z.read(prefix+'/A.brep'));b.write_bytes(z.read(prefix+'/B.brep'))
                      sa=read(a);sb=read(b)
                      print('ORIGINAL_VALID',n,shape_valid(sa),shape_valid(sb),flush=True)
                      fa=fix(sa);fb=fix(sb)
                      print('FIXED_VALID',n,shape_valid(fa),shape_valid(fb),flush=True)
                      pa=describe(fa,'A','A');pb=describe(fb,'B','B')
                      phases=[]
                      proof=reexport_equivalent_world(pa,pb,.01,allow_boolean=False,progress=phases.append)
                      print('FIXED_PROOF',n,proof,phases,flush=True)
          PY
