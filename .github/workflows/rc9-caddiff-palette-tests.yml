name: RC9 caddiff palette checks
on:
  push:
    paths:
      - 'patches/rc9/caddiff_palette.py'
      - 'patches/rc9/test_caddiff_palette.py'
      - '.github/workflows/rc9-caddiff-palette-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  palette:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Verify palette and status mapping
        run: python -m pytest -q patches/rc9/test_caddiff_palette.py
