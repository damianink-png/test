name: DS Compare R10 - Independent real OLSK CNC assembly test
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/benchmark-dscompare-r10-olsk.yml'
permissions:
  contents: read
jobs:
  cnc:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
      - name: Extract exact R10 sources
        shell: pwsh
        run: Expand-Archive -LiteralPath DSCompare_V4_6_R10_ZRODLA.zip -DestinationPath . -Force
      - name: Decode benchmark and select CNC assembly
        shell: pwsh
        run: |
          python -c "from pathlib import Path;import base64,lzma,hashlib; a=lzma.decompress(base64.b64decode(Path('benchmarks/public_cad_r10_script.xz.b64').read_text('ascii'))); assert hashlib.sha256(a).hexdigest()=='e166550eec59a35c33b78433a3e39d91b4f3c7e21e5a3fa8a637e92f68a8050e'; p=Path('benchmarks/benchmark_public_cad_r10.py'); s=a.decode(); assert s.count('for spec in CASES:')==1; p.write_text(s.replace('for spec in CASES:', 'for spec in CASES[2:3]:'),encoding='utf8')"
      - name: Install CAD requirements
        shell: pwsh
        run: |
          python -m pip install -r v46/requirements.txt
          if($LASTEXITCODE -ne 0){throw 'Dependency install failed'}
      - name: Compare original real CNC STEP against itself
        shell: pwsh
        timeout-minutes: 20
        run: |
          python -u benchmarks/benchmark_public_cad_r10.py
          if($LASTEXITCODE -ne 0){throw 'Real CNC model failed regression; see report'}
      - name: Upload measured results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DSCompare-R10-OLSK-CNC-Real-STEP
          path: |
            real_cad_results/**/*.json
            real_cad_results/**/*.txt
          if-no-files-found: warn
          retention-days: 30
