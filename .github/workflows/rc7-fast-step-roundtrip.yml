name: DS Compare RC7 - fast STEP roundtrip diagnostics
on:
  push:
    branches: [audit/dscompare-rc7-aligned-step-restart-20261026]
    paths:
      - scripts/rc7_aligned_step_restart.py
      - scripts/rc7_aligned_step_restart_patch.py
      - tests/test_rc7_aligned_step_restart.py
      - .github/workflows/rc7-fast-step-roundtrip.yml
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  small-cad:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONFAULTHANDLER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare RC7 code and aligned STEP implementation
        shell: pwsh
        run: |
          python -m zipfile -e DSCompare_RC7_SOURCES.zip src
          if ($LASTEXITCODE -ne 0) { throw 'Extraction failed' }
          python scripts/rc7_parametric_proof_patch.py src
          if ($LASTEXITCODE -ne 0) { throw 'Proof patch failed' }
          python scripts/rc7_alignment_only_common_guard.py src
          if ($LASTEXITCODE -ne 0) { throw 'Native Common guard failed' }
          Copy-Item scripts/rc7_aligned_step_restart.py src/dsac29/aligned_step_restart.py
          python scripts/rc7_aligned_step_restart_patch.py src
          if ($LASTEXITCODE -ne 0) { throw 'Aligned STEP integration patch failed' }
          Copy-Item tests/test_rc7_aligned_step_restart.py src/tests/test_rc7_aligned_step_restart.py
          Push-Location src
          try {
            ./BUDUJ_WINDOWS.ps1 -InstallOnly
            if ($LASTEXITCODE -ne 0) { throw 'RC7 dependencies failed' }
          } finally {
            Pop-Location
          }
          python -m pip install pytest
          if ($LASTEXITCODE -ne 0) { throw 'pytest install failed' }
      - name: Fast real OCC STEP write and reimport tests
        shell: pwsh
        working-directory: src
        run: |
          New-Item -ItemType Directory -Force ../evidence | Out-Null
          python -m pytest -q tests/test_rc7_aligned_step_restart.py tests/test_r13_deferred_alignment.py::test_single_comparison_without_shift_and_reused_cache_after_shift --durations=10 --junitxml=../evidence/small-step-results.xml
          if ($LASTEXITCODE -ne 0) { throw 'STEP roundtrip tests failed' }
      - name: Preserve small CAD STEP and round-trip diagnostics
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          $root=Join-Path $env:TEMP 'pytest-of-runneradmin'
          $i=0
          if (Test-Path $root) {
            Get-ChildItem $root -Filter 'WERYFIKACJA_IMPORTU.json' -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 20 | ForEach-Object {
              Copy-Item $_.FullName ("evidence/reimport_{0:D2}.json" -f $i)
              $i++
            }
            $i=0
            Get-ChildItem $root -Filter 'B_WYROWNANY.step' -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 8 | ForEach-Object {
              Copy-Item $_.FullName ("evidence/aligned_{0:D2}.step" -f $i)
              $i++
            }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RC7-fast-small-STEP-evidence
          path: evidence/**
          if-no-files-found: warn
          retention-days: 14

      - name: Publish machine-readable result for external diagnostics
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $state = if ('${{ job.status }}' -eq 'success') { 'success' } else { 'failure' }
          $url = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          gh api --method POST "repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA" -f "state=$state" -f "context=DSCompare/RC7-fast-STEP" -f "description=Small OCC STEP reimport and R13 restart tests" -f "target_url=$url"
          if ($LASTEXITCODE -ne 0) { throw 'Unable to publish CI status' }
