name: Transfer DSCompare 42013609684 OneEXE to SwissTransfer
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/transfer-42013609684.yml'
permissions:
  contents: read
  actions: read
jobs:
  transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      XDG_CONFIG_HOME: /tmp/swissfer-config
    steps:
      - name: Build pinned Swissfer
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/Blutsh/swissfer.git swissfer
          git -C swissfer checkout -q --detach 87fd6771421dda43cc27c695e14a067429043c17
          cargo build --release --locked --manifest-path swissfer/Cargo.toml
      - name: Restore confirmed sender state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pending "$XDG_CONFIG_HOME/swissfer"
          gh run download 41838393837 --repo "$GITHUB_REPOSITORY" --name swissfer-validation-state --dir pending
          cp pending/email-validations.json "$XDG_CONFIG_HOME/swissfer/email-validations.json"
      - name: Download exact 0.6.1 OneEXE and package a single-file ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input outgoing
          gh run download 42013609684 --repo "$GITHUB_REPOSITORY" --name DSCompare-0.6.1-Portable-OneEXE --dir input
          test -s input/DSCompare.exe
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_STORED
          exe=Path('input/DSCompare.exe')
          assert exe.stat().st_size > 100_000_000
          target=Path('outgoing/DSCompare-0.6.1-OneEXE-42013609684.zip')
          with ZipFile(target,'w',compression=ZIP_STORED) as z:
              z.write(exe, arcname='DSCompare.exe')
          with ZipFile(target) as z:
              assert z.namelist()==['DSCompare.exe']
              assert z.getinfo('DSCompare.exe').file_size==exe.stat().st_size
          print('ZIP size:',target.stat().st_size)
          PY
      - name: Upload ZIP through SwissTransfer
        shell: bash
        timeout-minutes: 18
        run: |
          set -euo pipefail
          timeout 900s swissfer/target/release/swissfer outgoing/DSCompare-0.6.1-OneEXE-42013609684.zip \
            --email damianink@gmail.com --duration 30 \
            --message 'DSCompare 0.6.1 OneEXE from build 42013609684' </dev/null > transfer.log 2>&1
          cat transfer.log
          link=$(grep -Eo 'https://(www\.)?swisstransfer\.com/dl/[a-zA-Z0-9-]+' transfer.log | tail -n 1 || true)
          test -n "$link"
          echo "SwissTransfer download: $link" >> "$GITHUB_STEP_SUMMARY"
      - name: Save sender state for next transfer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swissfer-validation-state
          path: /tmp/swissfer-config/swissfer/email-validations.json
          retention-days: 1
          if-no-files-found: warn
      - name: Save upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transfer-42013609684-logs
          path: transfer.log
          retention-days: 3
          if-no-files-found: warn
