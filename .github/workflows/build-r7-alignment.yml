name: DS Compare R8 - R7 base GUI polish and regression
on:
  push:
    branches: ['build/dscompare-r7-ui-polish-r8']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
        working-directory: source
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - name: Extract complete R7 source
        working-directory: .
        run: Expand-Archive -Path DSCompare_R7_source.zip -DestinationPath source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Inspect R7 UI source methods and styles
        run: |
          @'
          from pathlib import Path
          import ast
          for name in ('dsac29/gui_modern.py','dsac29/gui46.py','dsac29/gui45.py'):
              p=Path(name)
              print('=== INSPECT FILE ===',p,'exists=',p.exists(),flush=True)
              if not p.exists():continue
              raw=p.read_text(encoding='utf-8');lines=raw.splitlines()
              wanted=['_modern_compare','_modern_mass','_render_mass_file_rows','_mass_remove_one','_mass_remove_selected','_mass_reset','new_comparison','invalidate_comparison','_set_compare_result_state','finish','finished','_on_finish','_refresh_outputs','_update_mass_file_visual','_set_busy_ui','_set_mass_result_state','apply_theme','skin','_mass_invalidate','_file_refresh']
              tree=ast.parse(raw)
              for node in ast.walk(tree):
                  if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)) and any(a in node.name for a in wanted):
                      part='\\n'.join(lines[node.lineno-1:min(node.end_lineno,node.lineno+95)])
                      print('### METHOD',node.name,'lines',node.lineno,node.end_lineno,flush=True)
                      print(part,flush=True)
              for word in ['QPushButton#delete-one','QWidget#mass-file-row','QListWidget#mass-input-list',
                           'QPushButton#text-button','QPushButton:hover','QWidget#mass-queue','LIGHT={']:
                  k=raw.find(word)
                  if k!=-1:
                      print('### STYLE',word,'at',k,'excerpt',raw[max(0,k-180):k+450],flush=True)
          '@ | python -
          if($LASTEXITCODE -ne 0){throw 'R7 inspection failed'}
      - name: Install dependencies
        run: |
          ./BUDUJ_WINDOWS.ps1 -InstallOnly
          if($LASTEXITCODE -ne 0){throw 'Dependencies failed'}
          python -m pip install 'pytest>=8,<9' playwright pillow
          if($LASTEXITCODE -ne 0){throw 'pytest install failed'}
      - name: Run 109 regression tests
        run: |
          python TESTUJ.py
          if($LASTEXITCODE -ne 0){throw 'Regression failed'}
      - name: Build Windows application
        run: ./BUDUJ_WINDOWS.ps1 -NoInstall
      - name: Test packaged UI
        run: |
          $p=Start-Process -FilePath ./dist/DSCompare/DSCompare.exe -ArgumentList '--smoke-test-ui', 'UI_CHECK' -Wait -PassThru
          if($p.ExitCode -ne 0){throw 'UI failed'}
          if(-not (Test-Path 'UI_CHECK/UI_OK.json')){throw 'No UI result'}
      - name: Test packaged STEP and HTML worker
        run: |
          @'
          import subprocess,json,pathlib
          root=pathlib.Path.cwd()
          command=[str(root/'dist/DSCompare/DSCompare.exe'),'--worker','compare','--a',str(root/'samples/RAMA_REV_03.step'),'--b',str(root/'samples/RAMA_REV_04.step'),'--output',str(root/'FROZEN_CHECK'),'--generate-step','--revision-style','--no-bom','--preview3d']
          with open('frozen-worker.log','w') as log:
              result=subprocess.run(command,stdout=log,stderr=log,timeout=180)
          assert result.returncode==0,pathlib.Path('frozen-worker.log').read_text()
          folder=root/'FROZEN_CHECK'
          result=json.loads((folder/'_WYNIK_V37.json').read_text(encoding='utf-8'))
          assert result['ok'],result
          summary=json.loads((folder/'PODSUMOWANIE.json').read_text(encoding='utf-8'))
          assert summary['solids_A']==13 and summary['solids_B']==13,summary
          assert (folder/'POROWNANIE_KOLORY.step').stat().st_size>1000
          preview=(folder/'PODGLAD_KOLOROW_3D.html').read_text(encoding='utf-8')
          assert '/*__SCENE__*/' not in preview and 'const scene=[' in preview
          print('Frozen STEP + HTML PASS',summary['statuses'])
          '@ | python -
          if($LASTEXITCODE -ne 0){throw 'Packaged CAD worker failed'}
      - name: Verify HTML rendering in Edge
        run: |
          python TEST_HTML_BROWSER.py
          if($LASTEXITCODE -ne 0){throw 'WebGL preview failed'}
      - name: Package
        run: |
          'DS Compare 1.0 R7 — rozpakuj CAŁY folder i uruchom DSCompare.exe. Zachowaj folder _internal obok EXE.' | Set-Content -Encoding utf8 dist/DSCompare/START_TUTAJ.txt
          Compress-Archive -Path dist/DSCompare/* -DestinationPath DSCompare_1_0_R7_WINDOWS_x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DSCompare_1_0_R7_WINDOWS_x64
          path: source/DSCompare_1_0_R7_WINDOWS_x64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R7-verification
          path: |
            source/UI_CHECK
            source/FROZEN_CHECK
            source/frozen-worker.log
          if-no-files-found: ignore
