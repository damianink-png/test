name: DS Makieta UI5 R1 - Windows x64

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ds-makieta-from-zip.yml'
      - 'DS_Makieta_V36_UI5_R1_KOMPILACJA_JEDNYM_BAT*.zip'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build DSMakieta2019.dll UI5
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract newest UI5 ZIP
        shell: pwsh
        run: |
          $base = 'DS_Makieta_V36_UI5_R1_KOMPILACJA_JEDNYM_BAT'
          $files = @(Get-ChildItem -LiteralPath . -File | Where-Object {
            $_.BaseName -eq $base -or $_.BaseName -match ('^' + [regex]::Escape($base) + '-[0-9]+$')
          })
          if ($files.Count -eq 0) { throw 'UI5 ZIP not found in repository root.' }
          $zip = $files | Sort-Object -Property @{
            Expression = {
              if ($_.BaseName -match '-([0-9]+)$') { [int]$Matches[1] } else { 0 }
            }; Descending = $true
          } | Select-Object -First 1
          Write-Host "Using source archive: $($zip.Name)"
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath 'ui5_extract' -Force
          if (!(Test-Path 'ui5_extract/DS_Makieta_UI5/KOMPILUJ_MAKIETE.ps1')) {
            throw 'Expected DS_Makieta_UI5 folder was not found inside ZIP.'
          }

      - name: Verify UI5 sources
        shell: pwsh
        run: |
          $root = 'ui5_extract/DS_Makieta_UI5'
          foreach ($path in @('source/DSMakieta2019.cpp','source/makieta_core.h',
            'source/makieta_preview.rc','assets/makieta_preview_default.bmp',
            'compatible_partner/DSAssembly2019.dll','KOMPILUJ_MAKIETE.ps1','MSVC_WORKER.cmd')) {
            if (!(Test-Path (Join-Path $root $path))) { throw "Missing source: $path" }
          }

      - name: Compile using Visual Studio 2022 x64
        shell: pwsh
        working-directory: ui5_extract/DS_Makieta_UI5
        run: |
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File '.\KOMPILUJ_MAKIETE.ps1'
          if ($LASTEXITCODE -ne 0) { throw "Compiler returned exit code $LASTEXITCODE" }

      - name: Verify DLL and build result
        shell: pwsh
        run: |
          $root = 'ui5_extract/DS_Makieta_UI5/output'
          $status = Join-Path $root 'STATUS_KOMPILACJI.txt'
          if (!(Test-Path $status) -or (Get-Content $status -Raw).Trim() -ne 'BUILD_OK') { throw 'Build status is not BUILD_OK' }
          foreach ($name in @('DSMakieta2019.dll','DSAssembly2019.dll','DS_Makieta_UI5_DLL_GOTOWE.zip')) {
            if (!(Test-Path (Join-Path $root $name))) { throw "Missing output: $name" }
          }

      - name: Upload ready-to-use DLL ZIP and logs
        uses: actions/upload-artifact@v4
        with:
          name: DS-Makieta-UI5-R1-Windows-x64-GOTOWE-DLL
          path: ui5_extract/DS_Makieta_UI5/output/
          if-no-files-found: error

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DS-Makieta-UI5-R1-LOGI-BLEDOW
          path: ui5_extract/DS_Makieta_UI5/output/
          if-no-files-found: ignore
