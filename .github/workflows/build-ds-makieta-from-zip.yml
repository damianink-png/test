name: DS Makieta UI3 - build Windows x64 from ZIP

on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-ds-makieta-from-zip.yml', 'DS_Makieta_UI3_GITHUB_ACTIONS_READY.zip']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build DSMakieta2019.dll
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source ZIP
        shell: pwsh
        run: Expand-Archive -LiteralPath 'DS_Makieta_UI3_GITHUB_ACTIONS_READY.zip' -DestinationPath . -Force

      - name: Check source files
        shell: pwsh
        run: if (!(Test-Path 'source/DSMakieta2019.cpp') -or !(Test-Path 'source/makieta_preview.rc') -or !(Test-Path 'KOMPILUJ_MAKIETE.ps1')) { throw 'Source files missing from ZIP' }

      - name: Compile with Visual Studio 2022 x64
        shell: cmd
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File KOMPILUJ_MAKIETE.ps1

      - name: Verify build output
        shell: pwsh
        run: if (!(Test-Path 'output/DSMakieta2019.dll') -or !(Test-Path 'output/DSAssembly2019.dll') -or (Get-Content 'output/STATUS_KOMPILACJI.txt' -Raw).Trim() -ne 'BUILD_OK') { throw 'DLL build missing or failed' }

      - name: Upload DLLs and logs
        uses: actions/upload-artifact@v4
        with:
          name: DS-Makieta-UI3-Windows-x64-DLL
          path: output/
          if-no-files-found: error

      - name: Upload diagnostics if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DS-Makieta-UI3-build-errors
          path: output/
          if-no-files-found: ignore
