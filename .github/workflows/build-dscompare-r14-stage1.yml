name: DS Compare R14 - stage-one displacement with HTML tree
on:
  push:
    branches: ['build/dscompare-r14-sparse-shift-fix-20261023']
    paths:
      - 'DSCompare_1_0_R14_STAGE1_SOURCE.zip'
      - '.github/workflows/build-dscompare-r14-stage1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Extract exact R14 source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if(-not (Test-Path 'DSCompare_1_0_R14_STAGE1_SOURCE.zip')){throw 'Upload DSCompare_1_0_R14_STAGE1_SOURCE.zip at branch root first'}
          Expand-Archive -LiteralPath 'DSCompare_1_0_R14_STAGE1_SOURCE.zip' -DestinationPath 'source'
          foreach($f in @('dsac29/compare.py','dsac29/cli.py','dsac29/deferred_alignment.py','dsac29/similarity_gate.py','dsac29/preview3d.py','tests/test_r14_stage1_shift.py','BUDUJ_WINDOWS.ps1')){
            if(-not (Test-Path (Join-Path 'source' $f))){throw "Missing $f"}
          }
      - name: Install CAD and GUI dependencies
        working-directory: source
        shell: pwsh
        run: |
          ./BUDUJ_WINDOWS.ps1 -InstallOnly
          if($LASTEXITCODE -ne 0){throw 'Dependency installation failed'}
          python -m pip install 'pytest>=8,<9' playwright pillow
          if($LASTEXITCODE -ne 0){throw 'pytest installation failed'}
      - name: Test R14 stage-one placement and sparse safeguards
        working-directory: source
        shell: pwsh
        run: |
          python -m pytest -q tests/test_r14_stage1_shift.py tests/test_r14_sparse_shift.py tests/test_r13_deferred_alignment.py
          if($LASTEXITCODE -ne 0){throw 'R14 placement regression failed'}
      - name: All R14 core regression tests
        working-directory: source
        shell: pwsh
        run: |
          python TESTUJ.py
          if($LASTEXITCODE -ne 0){throw 'Core regression tests failed'}
      - name: HTML tree browser regression
        working-directory: source
        shell: pwsh
        run: |
          python TEST_HTML_BROWSER.py
          if($LASTEXITCODE -ne 0){throw 'HTML browser test failed'}
      - name: Package Windows x64 EXE
        working-directory: source
        shell: pwsh
        run: |
          ./BUDUJ_WINDOWS.ps1 -NoInstall
          if($LASTEXITCODE -ne 0){throw 'Build failed'}
          if(-not (Test-Path 'dist/DSCompare/DSCompare.exe')){throw 'Missing EXE'}
      - name: Test packaged EXE
        working-directory: source
        shell: pwsh
        run: |
          $p=Start-Process -FilePath './dist/DSCompare/DSCompare.exe' -ArgumentList '--smoke-test-ui','UI_CHECK' -Wait -PassThru
          if($p.ExitCode -ne 0 -or -not (Test-Path 'UI_CHECK/UI_OK.json')){throw 'Packaged UI failed'}
      - name: Archive Windows program
        working-directory: source
        shell: pwsh
        run: |
          'DS Compare R14: extract the entire folder, start DSCompare.exe and retain _internal.' | Set-Content -Encoding utf8 dist/DSCompare/START_TUTAJ.txt
          Compress-Archive -Path dist/DSCompare/* -DestinationPath DSCompare_1_0_R14_WINDOWS_x64.zip -CompressionLevel Optimal
      - uses: actions/upload-artifact@v4
        with:
          name: DSCompare_1_0_R14_WINDOWS_x64
          path: source/DSCompare_1_0_R14_WINDOWS_x64.zip
          if-no-files-found: error
