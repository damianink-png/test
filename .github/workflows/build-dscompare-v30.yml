name: DS Compare V3.0 - EXE and ZW3D 2019 Bridge DLL

on:
  workflow_dispatch:
  push:
    paths:
      - 'DSCompare_V3_ZRODLA.zip'
      - '.github/workflows/build-dscompare-v30.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 65
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack sources ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if(-not (Test-Path 'DSCompare_V3_ZRODLA.zip')){throw 'Missing DSCompare_V3_ZRODLA.zip in repository root'}
          $src=Join-Path $env:RUNNER_TEMP 'dscompare_v3'
          Expand-Archive -LiteralPath 'DSCompare_V3_ZRODLA.zip' -DestinationPath $src -Force
          foreach($required in @('DSCompareV3.py','requirements.txt','dsac29/compare.py','tests/test_brep29.py','bridge/DSAssemblyCompare2019.cpp')){
            if(-not (Test-Path (Join-Path $src $required))){throw "Missing source $required"}
          }
          "DS_COMPARE_SOURCE=$src" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DS_COMPARE_OUT=$src\dist\DSCompareV3" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Python 3.11 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Install B-Rep and test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if($LASTEXITCODE -ne 0){throw 'pip upgrade failed'}
          python -m pip install -r (Join-Path $env:DS_COMPARE_SOURCE 'requirements.txt') 'pytest>=8,<10' 'pyinstaller>=6.11,<7'
          if($LASTEXITCODE -ne 0){throw 'Dependency install failed'}

      - name: Run unit tests
        shell: pwsh
        run: |
          Set-Location $env:DS_COMPARE_SOURCE
          python -m pytest -q tests
          if($LASTEXITCODE -ne 0){throw 'Unit tests failed'}

      - name: Build standalone DS Compare GUI
        shell: pwsh
        run: |
          Set-Location $env:DS_COMPARE_SOURCE
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name DSCompareV3 --collect-all OCP DSCompareV3.py
          if($LASTEXITCODE -ne 0){throw 'PyInstaller failed'}
          if(-not (Test-Path (Join-Path $env:DS_COMPARE_OUT 'DSCompareV3.exe'))){throw 'Missing EXE'}

      - name: Build native ZW3D bridge DLL using MSVC
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $vswhere="${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $inst=& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if(-not $inst){throw 'Missing Visual C++ x64 toolchain'}
          $vcvars=Join-Path $inst 'VC\Auxiliary\Build\vcvars64.bat'
          if(-not (Test-Path $vcvars)){throw 'Missing vcvars64.bat'}
          $env:DS_COMPARE_VCVARS=$vcvars
          $wrapper=Join-Path $env:DS_COMPARE_SOURCE 'bridge\build_bridge_wrapper.cmd'
          & $wrapper
          if($LASTEXITCODE -ne 0){throw "Bridge DLL build failed: $LASTEXITCODE"}
          if(-not (Test-Path (Join-Path $env:DS_COMPARE_OUT 'DSAssemblyCompare2019.dll'))){throw 'Missing DLL'}

      - name: Add instructions and checksum
        shell: pwsh
        run: |
          $dest=$env:DS_COMPARE_OUT
          Copy-Item (Join-Path $env:DS_COMPARE_SOURCE 'README.md') (Join-Path $dest 'README.md')
          Copy-Item (Join-Path $env:DS_COMPARE_SOURCE 'samples') (Join-Path $dest 'samples') -Recurse
          Copy-Item (Join-Path $env:DS_COMPARE_SOURCE 'bridge\README_ZW3D.txt') (Join-Path $dest 'README_ZW3D.txt')
          $files=@('DSCompareV3.exe','DSAssemblyCompare2019.dll')
          foreach($f in $files){$sha=(Get-FileHash (Join-Path $dest $f) -Algorithm SHA256).Hash; "$f $sha" | Add-Content (Join-Path $dest 'SHA256.txt')}
          $exe=(Get-Item (Join-Path $dest 'DSCompareV3.exe')).Length
          $dll=(Get-Item (Join-Path $dest 'DSAssemblyCompare2019.dll')).Length
          "EXE_SIZE=$exe" | Set-Content (Join-Path $dest 'BUILD_STATUS.txt')
          "DLL_SIZE=$dll" | Add-Content (Join-Path $dest 'BUILD_STATUS.txt')
          'BUILD_OK_WINDOWS_X64_UNTESTED_IN_ZW3D' | Add-Content (Join-Path $dest 'BUILD_STATUS.txt')

      - name: Publish ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSCompare-V3-Windows-x64-EXE-and-ZW3D-DLL
          path: ${{ env.DS_COMPARE_OUT }}/
          if-no-files-found: error
          retention-days: 30
