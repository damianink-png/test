<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DS Compare — projekt okna startowego</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI Variable", "Segoe UI", Arial, sans-serif;
      font-synthesis: none;
      --cyan:#35d7ed;
      --orange:#f1a33b;
    }
    * { box-sizing: border-box; }
    html,body {height:100%; margin:0;}
    body {
      min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
      padding:34px 14px 28px; overflow-x:hidden;
      background: radial-gradient(ellipse at 50% 24%,#1c3346 0%,#0a121e 42%,#060b13 80%);
      color:#f1f6fe;
    }
    .splash {
      position:relative; width:min(1120px,calc(100vw - 28px)); aspect-ratio:1120/620;
      overflow:hidden; border-radius:22px;
      isolation:isolate;
      background:#091827;
      box-shadow: 0 35px 115px rgba(0,0,0,.74),0 8px 26px rgba(0,0,0,.3);
      -webkit-user-select:none; user-select:none;
    }
    .splash::before {
      content:""; position:absolute; inset:0; z-index:7; pointer-events:none;
      box-shadow:inset 0 1px 0 #d4e7ee1c,inset 0 -1px 0 #5b92a018;
      border-radius:inherit;
    }
    .splash::after {
      content:"";position:absolute;z-index:3;pointer-events:none;
      width:70%;height:90%;left:16%;top:-68%;
      transform:rotate(-25deg);filter:blur(14px);
      background:radial-gradient(ellipse,#1dd4fc19,transparent 67%);
      animation: ambiance 8s ease-in-out infinite alternate;
    }
    .bg {position:absolute;inset:0;z-index:0;overflow:hidden;
      background:
       radial-gradient(ellipse at 79% 45%,#115a6f4d 0,transparent 44%),
       radial-gradient(ellipse at 46% 94%,#1970aa38 0,transparent 37%),
       linear-gradient(125deg,#0a1623 5%,#102b41 52%,#051019 100%);
    }
    .blueprint {
      position:absolute;inset:0;opacity:.32;z-index:1;pointer-events:none;
      background-image:linear-gradient(#6199ae21 1px,transparent 1px),linear-gradient(90deg,#6199ae21 1px,transparent 1px);
      background-size:54px 54px;
      transform:perspective(610px) rotateX(52deg) translateY(210px) scale(1.4);
      transform-origin:center bottom;
      mask-image:linear-gradient(to top,black,transparent 53%);
    }
    .hero {
      position:absolute;z-index:1;height:117%;width:auto;right:-3.5%;top:-7%;max-width:none;
      object-fit:contain;opacity:.99;filter:contrast(1.05) saturate(1.14) drop-shadow(0 10px 22px #001e31);
      -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000a 21%,#000 38%);
      mask-image:linear-gradient(90deg,transparent 0%,#000a 21%,#000 38%);
      animation:hero-float 8.5s ease-in-out infinite alternate;
      pointer-events:none;
    }
    .leftshade {
      pointer-events:none;position:absolute;inset:0;z-index:2;
      background:linear-gradient(91deg,#081521fa 0%,#081521fa 26%,#081521e3 37%,#0b1b295d 54%,transparent 77%);
    }
    .glowline-top {position:absolute;left:-1%;top:0;width:65%;height:2px;opacity:.7;z-index:4;
      background:linear-gradient(90deg,transparent,#2fd8ef,transparent);filter:blur(1px)}
    .glowline-bottom {position:absolute;left:30%;bottom:0;width:70%;height:1px;opacity:.5;z-index:4;
      background:linear-gradient(90deg,transparent,#137eaa,transparent)}
    .light-sweep {
      position:absolute;z-index:3;top:-24%;left:0;width:120px;height:155%;pointer-events:none;
      background:linear-gradient(90deg,transparent 0%,#00b5df06 50%,#42daff32 87%,#dbffff8a 97%,transparent 100%);
      filter:drop-shadow(0 0 16px #39cdfb88);
      transform:translateX(420px) skewX(-12deg);
      animation:sweep 6.2s cubic-bezier(.5,.02,.5,.98) infinite alternate;
      opacity:.75;
      mix-blend-mode:screen;
    }
    .light-sweep::after{content:"";position:absolute;right:3px;top:9%;bottom:6%;width:2px;background:#99eeffb8;box-shadow:0 0 15px 2px #01d9fa88;}
    .scan-halo {position:absolute;z-index:3;top:24%;left:0;width:220px;height:220px;border-radius:50%;
      background:radial-gradient(circle,#47ddff17 0%,#18bdf90b 31%,transparent 69%);
      transform:translateX(420px);animation:halo-travel 6.2s cubic-bezier(.5,.02,.5,.98) infinite alternate;
      mix-blend-mode:screen;pointer-events:none;}
    .noise {position:absolute;inset:0;z-index:3;pointer-events:none;opacity:.085;
      background-image:url('data:image/svg+xml,%3Csvg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="n"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="2" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23n)" opacity=".45"/%3E%3C/svg%3E');}
    .hud {position:absolute;z-index:5;inset:0;display:flex;flex-direction:column;pointer-events:none;}
    .top {display:flex;align-items:center;justify-content:space-between;gap:24px;padding:61px 68px 0;}
    .brand {display:flex;align-items:center;gap:17px;}
    .logo {width:64px;height:64px;filter:drop-shadow(0 7px 10px #051321cc);flex:none;}
    .brandname {font-size:47px;line-height:1;letter-spacing:-1.9px;white-space:nowrap;text-shadow:0 2px 10px #030a13b8;}
    .brandname b{font-weight:790;font-style:italic;}
    .brandname em{font-weight:350;font-style:italic;color:#f0f4fb;}
    .version {font-size:10px;letter-spacing:2px;color:#80a8bc;position:absolute;right:66px;top:70px;font-weight:650;}
    .desc {margin:58px 0 0 71px;max-width:395px;}
    .eyebrow {display:flex;align-items:center;gap:12px;color:#61cade;font-size:12px;font-weight:700;letter-spacing:2.1px;margin:0 0 18px;}
    .eyebrow i{width:20px;height:1px;background:#25d4ef;box-shadow:0 0 9px #0cf1ff;}
    .headline {font-size:31px;font-weight:625;line-height:1.2;letter-spacing:-.6px;margin:0;color:#edf7ff;text-shadow:0 3px 16px #000c;}
    .sub {margin:16px 0 0;color:#8eacbf;font-size:14px;line-height:1.5;max-width:260px;}
    .foot {margin:auto 0 0;padding:0 67px 47px;display:flex;align-items:flex-end;justify-content:space-between;gap:30px;}
    .loading {min-width:370px;width:46%;}
    .loading-kicker{color:#87adbf;font-size:10px;letter-spacing:1.7px;font-weight:650;margin:0 0 13px;text-transform:uppercase;}
    .loading-text {font-size:15px;color:#e1f2fc;font-weight:550;margin:0 0 16px;min-height:19px;}
    .track{height:3px;background:#5470825b;position:relative;overflow:hidden;border-radius:3px;}
    .track:before{content:"";position:absolute;inset:0;width:36%;border-radius:3px;
      background:linear-gradient(90deg,transparent,#2fd8ed 40%,#a5f7ff 85%,transparent);
      filter:drop-shadow(0 0 6px #0fd1ec);
      animation:loader 2.6s cubic-bezier(.35,0,.65,1) infinite;}
    .track[data-determinate="true"]:before{animation:none;transform:none;width:var(--provided,0%);background:linear-gradient(90deg,#1c9bc9,#6ff0ff)}
    .footer-meta{color:#6d9bad;font-size:10px;font-weight:550;letter-spacing:1.25px;line-height:1.6;text-align:right;opacity:.85;}
    .accent-corner{position:absolute;z-index:4;left:0;bottom:0;width:180px;height:55px;pointer-events:none;
      background:linear-gradient(151deg,transparent 0%,transparent 71%,#e18e333a 72%,transparent 74%);}
    .small-dots{position:absolute;right:54px;bottom:112px;z-index:3;display:flex;gap:6px;opacity:.8}
    .small-dots span{width:3px;height:3px;border-radius:50%;background:#40d9e7;box-shadow:0 0 8px #2cdbff}
    .small-dots span:nth-child(2){opacity:.5}.small-dots span:nth-child(3){opacity:.25}
    @keyframes sweep{0%{transform:translateX(390px) skewX(-12deg);opacity:.25}15%{opacity:.9}85%{opacity:.9}100%{transform:translateX(980px) skewX(-12deg);opacity:.30}}
    @keyframes halo-travel{0%{transform:translateX(395px)}100%{transform:translateX(983px)}}
    @keyframes hero-float{0%{transform:translateY(0) scale(1)}100%{transform:translateY(-7px) scale(1.006)}}
    @keyframes loader{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}
    @keyframes ambiance{from{opacity:.6;transform:rotate(-25deg) translateX(0)}to{opacity:1;transform:rotate(-25deg) translateX(100px)}}
    .tools{margin:22px 0 0;display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;}
    .tools button{color:#c5dbe9;background:#102235;border:1px solid #2b4c61;border-radius:8px;padding:10px 16px;font:inherit;cursor:pointer;}
    .tools button:hover{background:#14354a;border-color:#397998;}
    .tools .hint{font-size:12px;color:#7f9db0;}
    .paused .hero,.paused .light-sweep,.paused .scan-halo,.paused .track:before,.paused.splash:after{animation-play-state:paused}
    @media (prefers-reduced-motion:reduce) {.hero,.light-sweep,.scan-halo,.track:before,.splash:after{animation:none!important}.light-sweep{opacity:.3;transform:translateX(760px) skewX(-12deg)}.scan-halo{transform:translateX(760px)}}
    @media(max-width:850px){body{padding:12px}.splash{width:min(100%,1120px)}.top{padding:5.3% 6% 0}.logo{width:clamp(26px,5.7vw,64px);height:auto}.brand{gap:clamp(5px,1.5vw,17px)}.brandname{font-size:clamp(20px,4.1vw,47px)}.desc{margin:5% 0 0 6%;max-width:36%}.eyebrow{font-size:clamp(6px,1.15vw,12px);margin-bottom:3%;letter-spacing:1px;gap:8px}.headline{font-size:clamp(15px,2.9vw,31px)}.sub{font-size:clamp(8px,1.3vw,14px);margin-top:6px}.version{right:6%;top:9%;font-size:8px}.foot{padding:0 6% 4.5%;}.loading{min-width:0;width:44%}.loading-kicker,.footer-meta{font-size:clamp(5px,1vw,10px)}.loading-kicker{margin-bottom:6px}.loading-text{font-size:clamp(9px,1.4vw,15px);margin-bottom:9px}.hero{height:118%;right:-4%}}
    @media(max-width:520px){.brandname{letter-spacing:-.6px}.desc{margin-top:4%}.sub{max-width:100%}.version{display:none}.footer-meta{display:none}.loading{width:75%}.tools .hint{width:100%;text-align:center}}
  </style>
</head>

        <div class="loading">
          <p class="loading-kicker">URUCHAMIANIE APLIKACJI</p>
          <p class="loading-text" id="status">Przygotowywanie silnika CAD…</p>
          <div class="track" id="progress" role="progressbar" aria-label="Uruchamianie programu"></div>
        </div>
        <div class="footer-meta">LOKALNIE · BEZ CHMURY<br>DS COMPARE / STARTUP</div>
      </div>
    </div>
    <div class="small-dots"><span></span><span></span><span></span></div>
  </section>
  <div class="tools">
    <button id="pause" type="button">⏸ Wstrzymaj animację</button>
    <button id="restart" type="button">↻ Uruchom od nowa</button>
    <span class="hint">Samodzielny prototyp — nie uruchamia analizy STEP</span>
  </div>
  <script>
    (()=>{
      const splash=document.getElementById('splash');
      const pause=document.getElementById('pause');
      pause.addEventListener('click',()=>{
        splash.classList.toggle('paused');
        pause.textContent=splash.classList.contains('paused')?'▶ Wznów animację':'⏸ Wstrzymaj animację';
      });
      document.getElementById('restart').addEventListener('click',()=>{
        splash.classList.remove('paused');pause.textContent='⏸ Wstrzymaj animację';
        splash.getAnimations({subtree:true}).forEach(a=>{a.cancel();a.play()});
      });
      // Future native integration can supply an actual phase/percentage;
      // the prototype deliberately does not invent progress.
      window.DSCompareSplash={
        setStatus(text){document.getElementById('status').textContent=String(text)},
        setProgress(value){const p=document.getElementById('progress');
          if(value===null||value===undefined){p.removeAttribute('aria-valuenow');p.removeAttribute('data-determinate');p.style.removeProperty('--provided');return}
          const n=Math.min(100,Math.max(0,Number(value)));if(!Number.isFinite(n))return;
          p.setAttribute('aria-valuenow',String(n));p.setAttribute('data-determinate','true');p.style.setProperty('--provided',n+'%');
        }
      };
    })();
  </script>
</body>
</html>
