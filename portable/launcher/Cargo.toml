[package]
name = "dscompare-portable"
version = "0.6.11"
edition = "2021"
build = "build.rs"
[features]
default = []
onefile = []
[dependencies]
sha2 = "0.10"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4"
memmap2 = "0.9"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_UI_HiDpi"] }
[build-dependencies]
winres = "0.1"
