[package]
name = "dscompare-desktop"
version = "0.5.0"
edition = "2021"
[lib]
name = "dscompare_core"
[features]
default = []
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-plugin-opener", "dep:tauri-build"]
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
tauri = { version = "2", features = ["protocol-asset"], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }
[[bin]]
name = "DSCompareDesktop"
path = "src/main.rs"
required-features = ["desktop"]
